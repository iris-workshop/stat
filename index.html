数量？","o":["离散","连续"],"a":"离散\n离散＝计数（0、1、2个孩子，不会有1.5个）；连续＝测量（如身高1.52米）。"}],"0:12":[{"q":"身高？","o":["離散","連續"],"a":"連續\n身高可為160、160.5或160.52厘米（連續）；汽車數量只能逐部計數（離散）。"},{"q":"身高？","o":["离散","连续"],"a":"连续\n身高可为160、160.5或160.52厘米（连续）；汽车数量只能按整数计数（离散）。"}],"0:13":[{"q":"擁有汽車的數量？","o":["離散","連續"],"a":"離散\n汽車只能數0、1、2部，不能有1.5部；身高可有小數。前者離散，後者連續。"},{"q":"拥有汽车的数量？","o":["离散","连续"],"a":"离散\n汽车只能数0、1、2辆，不能有1.5辆；身高可有小数。前者离散，后者连续。"}],"0:14":[{"q":"性別是？","o":["名義","順序","等距／比率"],"a":"名義\n名義尺度的類別沒有自然次序。例如性別或血型（A、B、AB、O），沒有高低之分。"},{"q":"性别是？","o":["定类","定序","等距／等比"],"a":"定类\n定类尺度的类别没有自然次序。例如性别或血型（A、B、AB、O），没有高低之分。"}],"0:15":[{"q":"教師評價（優秀、良好、一般、差、很差）？","o":["名義","順序","等距／比率"],"a":"順序\n名義：無次序（血型）；順序：有次序（好＞一般＞差），但級別間的差距不一定相等。"},{"q":"教师评价（优秀、良好、一般、差、很差）？","o":["定类","定序","等距／等比"],"a":"定序\n定类：无顺序（血型）；定序：有顺序（好＞一般＞差），但等级间的差距不一定相等。"}],"0:16":[{"q":"年齡（以年計）？","o":["名義","順序","等距／比率"],"a":"等距／比率\n等距：20→21歲與30→31歲均相差一年；年齡亦有真正零點，因此比率有意義。"},{"q":"年龄（以年计）？","o":["定类","定序","等距／等比"],"a":"等距／等比\n等距：20→21岁与30→31岁均相差一年；年龄也有真正零点，因此比率有意义。"}],"0:55":[{"q":"推論統計通常以甚麼為基礎？","o":["母體","樣本","個體","群組"],"a":"樣本\n推論統計利用樣本推斷母體。例如調查 800 名學生，估計全港大學生的相關比例。"},{"q":"推断统计通常以什么为基础？","o":["总体","样本","个体","群组"],"a":"样本\n推断统计利用样本推断总体。例如调查 800 名学生，估计全港大学生的相关比例。"}],"0:56":[{"q":"「90%的宿舍居民支持擬議的禁煙措施。」這屬於哪類統計？","o":["推論統計","單變量描述統計","雙變量描述統計","多變量描述統計"],"a":"單變量描述統計\n單變量：只看是否贊成；描述統計：概括已觀察到的回應。若由樣本推算全體居民才是推論統計。"},{"q":"“90%的宿舍居民支持拟议的禁烟措施。”这属于哪类统计？","o":["推断统计","单变量描述统计","双变量描述统计","多变量描述统计"],"a":"单变量描述统计\n单变量：只看是否赞成；描述统计：概括已观察到的回答。若由样本推算全体居民才是推断统计。"}],"0:57":[{"q":"以下哪項是離散變量？","o":["身高","年齡","每加侖行駛英里數","汽車數目"],"a":"汽車數目\n離散變量取可逐一計數的數值，例如0、1、2，這類數量不會出現小數。"},{"q":"以下哪项是离散变量？","o":["身高","年龄","每加仑行驶英里数","汽车数量"],"a":"汽车数量\n离散变量取可逐一计数的数值，例如0、1、2，这类数量不会出现小数。"}],"0:58":[{"q":"以下哪項是連續變量？","o":["子女數目","完成作業所花的時間","本學期修讀的課程數目","昨天進食的餐數"],"a":"完成作業所花的時間\n時間可為20、20.5或20.52分鐘（連續）；作業份數是整數計數（離散）。"},{"q":"以下哪项是连续变量？","o":["子女数量","完成作业所花的时间","本学期修读的课程数量","昨天进食的餐数"],"a":"完成作业所花的时间\n时间可为20、20.5或20.52分钟（连续）；作业份数是整数计数（离散）。"}],"0:59":[{"q":"以下哪項屬於名義尺度？","o":["家 o":["均是","均否","50是；60否","50否；60是"],"a":"50是；60否\n區間約為[43.58, 55.11]；50在區間內，60高於上限。"},{"q":"置信区间为 [43.58, 55.11]。50 在区间内吗？60 呢？","o":["均是","均否","50是；60否","50否；60是"],"a":"50是；60否\n区间约为[43.58, 55.11]；50在区间内，60高于上限。"}],"5:4":[{"q":"降雨pH值：n=40，平均數=3.7，s=0.5。按課程Z方法構建99%置信區間。","o":[],"a":"3.496 至 3.904"},{"q":"降雨pH值：n=40，均值=3.7，s=0.5。按课程Z方法构建99%置信区间。","o":[],"a":"3.496 至 3.904"}],"1:51":[{"q":"哪一種集中趨勢的度量最適合描述電影明星的眼睛顏色？","o":["平均數","眾數","中位數","中全距"],"a":"眾數\n眾數＝出現次數最多的數值或類別。例如藍、棕、棕 → 棕色是眾數，毋須數值次序。"},{"q":"哪一种集中趋势的度量最适合描述电影明星的眼睛颜色？","o":["均值","众数","中位数","极差中点"],"a":"众数\n众数＝出现次数最多的数值或类别。例如蓝、棕、棕 → 棕色是众数，无需数值次序。"}],"1:52":[{"q":"五個分數中，若只有最高分增加，哪項度量必定改變？","o":["平均數","中位數","眾數","以上皆非"],"a":"平均數\n平均數 = 總和 ÷ 個數；最高分上升會增加總和，而個數不變。"},{"q":"五个分数中，若只有最高分增加，哪项度量必定改变？","o":["均值","中位数","众数","以上皆非"],"a":"均值\n均值 = 总和 ÷ 个数；最高分上升会增加总和，而个数不变。"}],"1:55":[{"q":"15個已排序的分數中，哪個位置是中位數？","o":["第7個","第8個","第9個","第15個"],"a":"第8個\n當觀察值數目為奇數時，中位數位置 = (n + 1) ÷ 2 = 8。"},{"q":"15个已排序的分数中，哪个位置是中位数？","o":["第7个","第8个","第9个","第15个"],"a":"第8个\n当观察值数目为奇数时，中位数位置 = (n + 1) ÷ 2 = 8。"}],"1:56":[{"q":"為甚麼名義變量不能計算中位數？","o":["頻數未知","類別無法排序","樣本太小","平均數為零"],"a":"類別無法排序\n中位數需要有次序。例如差、普通、好可以排序並找出中央類別；眼睛顏色則無自然次序。"},{"q":"为什么定类变量不能计算中位数？","o":["频数未知","类别无法排序","样本太小","均值为零"],"a":"类别无法排序\n中位数需要有次序。例如差、一般、好可以排序并找出中央类别；眼睛颜色则无自然次序。"}],"1:58":[{"q":"第三十分位數相當於哪個百分位數？","o":["第3","第10","第30","第75"],"a":"第30\n每一個十分位數相隔10個百分位點，因此D3 = P30。"},{"q":"第三十分位数相当于哪个百分位数？","o":["第3","第10","第30","第75"],"a":"第30\n每一个十分位数相隔10个百分位点，因此D3 = P30。"}],"1:59":[{"q":"45人的收入樣本包含美國五家最大企業的行政總裁及40名兼職員工。收入分布最可能是哪一種？","o":["對稱","負偏態","正偏態","均勻"],"a":"正偏態\n正偏態指右尾較長。例如收入 10、11、12、13、100：少數高收入拉長右尾。"},{"q":"45人的收入样本包含美国五家最大企业的首席执行官及40名兼职员工。收入分布最可能是哪一种？","o":["对称","负偏态","正偏态","均匀"],"a":"正偏态\n正偏态指右尾较长。例如收入 10、11、12、13、100：少数高收入拉长右尾。"}],"1:60":[{"q":"若考試分數的平均數為55、中位數為60，通常反映哪種分布形態？","o":["正偏態","對稱","負偏態","均勻"],"a":"負偏態\n平均數低於中位數通常表示長尾向左，但僅憑兩個統計量無法確定分布形態。"},{"q":"若考试分数的均值为55、中位数为60，通常反映哪种分布形态？","o":["正偏态","对称","负偏态","均匀"],"a":"负偏态\n均值低于中位数通常表示长尾向左，但仅凭两个统计量无法确定分布形态。"}],"0:17":[{"q":"調查將學生專業編碼為1=心理學、2=政治學、3=社會研究。a. 屬於定性還是定量變量？b. 測量尺度是甚麼？c. 編碼3是否比編碼1大？","o":["定性；名義；否","定量；順序；是","定性；順序；是"],"a":"定性；名義；否\n名義尺度沒有自然次序；專業代碼1、2、3只是標籤，並不代表數量。"},{"q":"调查将学生专业编码为1=心理学、2=政治学、3=社会研究。a. 属于定性还是定量变量？b. 测量尺度是什么？c. 编码3是否比编码1大？","o":["定性；定类；否","定量；定序；是","定性；定序；是"],"a":"定性；定类；否\n定类尺度没有自然次序；专业代码1、2、3只是标签，并不代表数量。"}],"0:18":[{"q":"學生對教師的評價為優秀、良好、一般、較差、很差。a. 屬於哪種測量尺度？","o":["名義尺度","順序尺度","等距／比率尺度"],"a":"順序尺度\n好比差高一級或多級，但不能量度兩者相差多少單位；名義類別（如血型）則無次序。"},{"q":"学生对教师的评价为优秀、良好、一般、较差、很差。a. 属于哪种测量尺度？","o":["定类尺度","定序尺度","等距／比率尺度"],"a":"定序尺度\n好比差等级高，但不能测量两者相差多少单位；定类类别（如血型）则无顺序。"}],"0:19":[{"q":"學生對教師的評價為優秀、良好、一般、較差、很差。b. 這些評價能否排序？","o":["能","不能"],"a":"能\n優秀＞好＞一般＞差＞劣。順序尺度可排序，但級別間不一定等距。"},{"q":"学生对教师的评价为优秀、良好、一般、较差、很差。b. 这些评价能否排序？","o":["能","不能"],"a":"能\n优秀＞好＞一般＞差＞劣。定序尺度可排序，但等级间不一定等距。"}],"0:20":[{"q":"學生對教師的評價為優秀、良好、一般、較差、很差。c. 能否精確量化良好比較差好多少？","o":["能","不能"],"a":"不能\n好優於差，但不能說好是差的兩倍，或假設不同級別間的差距相同。"},{"q":"学生对教师的评价为优秀、良好、一般、较差、很差。c. 能否精确量化良好比较差好多少？","o":["能","不能"],"a":"不能\n好优于差，但不能说好是差的两倍，或假设不同等级间的差距相同。"}],"0:21":[{"q":"百分比或比例比較的是：","o":["某一部分與整體","一個部分與另一部分","兩個時期","實際事件數與可能事件數"],"a":"某一部分與整體\n比例＝部分 ÷ 總數；百分比＝比例 × 100。例如 50 人中有 20 人 → 20/50 = 0.4 = 40%。"},{"q":"百分比或比例比较的是：","o":["某一部分与整体","一个部分与另一部分","两个时期","实际事件数与可能事件数"],"a":"某一部分与整体\n比例＝部分 ÷ 总数；百分比＝比例 × 100。例如 50 人中有 20 人 → 20/50 = 0.4 = 40%。"}],"0:22":[{"q":"以下哪個公式用於計算百分比？","o":["(f / N) × 100","(N / f) × 100","f / N","(f2 - f1) / f1"],"a":"(f / N) × 100\n比例＝部分 ÷ 總數；百分比＝比例 × 100。例如 50 人中有 20 人 → 20/50 = 0.4 = 40%。"},{"q":"以下哪个公式用于计算百分比？","o":["(f / N) × 100","(N / f) × 100","f / N","(f2 - f1) / f1"],"a":"(f / N) × 100\n比例＝部分 ÷ 总数；百分比＝比例 × 100。例如 50 人中有 20 人 → 20/50 = 0.4 = 40%。"}],"0:23":[{"q":"一個班有50名學生，其中20名學習心理學。a. 求學習心理學的學生比例。","o":[],"a":"20 ÷ 50 = 0.40。"},{"q":"一个班有50名学生，其中20名学习心理学。a. 求学习心理学的学生比例。","o":[],"a":"20 ÷ 50 = 0.40。"}],"0:24":[{"q":"一個班有50名學生，其中20名學習心理學。b. 求學習心理學的學生百分比。","o":[],"a":"20 ÷ 50 × 100 = 40%。"},{"q":"一个班有50名学生，其中20名学习心理学。b. 求学习心理学的学生百分比。","o":[],"a":"20 ÷ 50 × 100 = 40%。"}],"0:25":[{"q":"一項研究只有15名參與者。根據本課程的指引，研究者應報告甚麼？","o":["僅報告百分比","實際頻數","僅報告比例","不報告結果"],"a":"實際頻數\n15人中每人已佔6.67%；寫1/15比單寫百分比更能反映樣本很小。並非不能計百分比。"},{"q":"一项研究只有15名参与者。根据本课程的指引，研究者应报告什么？","o":["仅报告百分比","实际频数","仅报告比例","不报告结果"],"a":"实际频数\n15人中每人已占6.67%；写1/15比只写百分比更能反映样本很小。并非不能算百分比。"}],"0:26":[{"q":"百分比能否用於名義和順序變量？","o":["能，適用於所有測量尺度","不能，僅適用於等距／比率變量","僅當N小於20","僅當結果為50%"],"a":"能，適用於所有測量尺度\n百分比計算的是類別人數，而非類別數值：30人中12人選巴士＝40%，交通工具仍屬名義尺度。"},{"q":"百分比能否用于定类和定序变量？","o":["能，适用于所有测量尺度","不能，仅适用于等距／比率变量","仅当N小于20","仅当结果为50%"],"a":"能，适用于所有测量尺度\n百分比计算的是类别人数，而非类别数值：30人中12人选公交车＝40%，交通工具仍属定类尺度。"}],"0:27":[{"q":"比率比較的是：","o":["某一部分與整體","一個部分與另一部分","樣本與母體","較早數值與較晚數值"],"a":"一個部分與另一部分\n比率比較兩個數量，例如 20 名女生與 10 名男生的比率＝20 ÷ 10＝2:1，而非 20 ÷ 30。"},{"q":"比率比较的是：","o":["某一部分与整体","一个部分与另一部分","样本与总体","较早数值与较晚数值"],"a":"一个部分与另一部分\n比率比较两个数量，例如 20 名女生与 10 名男生的比率＝20 ÷ 10＝2:1，而非 20 ÷ 30。"}],"0:28":[{"q":"類別1與類別2的比率應使用哪個公式？","o":["f1 / f2","f2 / f1","f1 / N","(f2 - f1) / f1"],"a":"f1 / f2\n比率比較兩個數量，例如 20 名女生與 10 名男生的比率＝20 ÷ 10＝2:1，而非 20 ÷ 30。"},{"q":"类别1与类别2的比率应使用哪个公式？","o":["f1 / f2","f2 / f1","f1 / N","(f2 - f1) / f1"],"a":"f1 / f2\n比率比较两个数量，例如 20 名女生与 10 名男生的比率＝20 ÷ 10＝2:1，而非 20 ÷ 30。"}],"0:29":[{"q":"班里有23名女生和19名男生。求男生與女生的比率，以及女生與男生的比率。","o":[],"a":"男：女 = 19/23 = 0.83；女：男 = 23/19 = 1.21。"},{"q":"班里有23名女生和19名男生。求男生与女生的比率，以及女生与男生的比率。","o":[],"a":"男：女 = 19/23 = 0.83；女：男 = 23/19 = 1.21。"}],"0:30":[{"q":"發生率比較的是：","o":["一個類別與另一個類別","某一時期的實際事件數與可能事件數","樣本百分比與母體百分比","較早數值與較晚數值"],"a":"某一時期的實際事件數與可能事件數\n率衡量在指定期間內發生的事件數，相對於有可能發生該事件的相關人口，通常再乘以一個倍數。例如一年內每千名居民有 10 名嬰兒出生。牛奶佔杯中液體的比例只是比例或百分比，不是發生率，因為它不是一段時間內的事件數。"},{"q":"发生率比较的是：","o":["一个类别与另一个类别","某一时期的实际事件数与可能事件数","样本百分比与总体百分比","较早数值与较晚数值"],"a":"某一时期的实际事件数与可能事件数\n率衡量在指定期间内发生的事件数，相对于有可能发生该事件的相关人口，通常再乘以一个倍数。例如一年内每千名居民有 10 名婴儿出生。牛奶占杯中液体的比例只是比例或百分比，不是发生率，因为它不是一段时间内的事件数。"}],"0:31":[{"q":"某鎮有2,300名居民，去年有17名嬰兒出生。求每千名居民的出生率。","o":[],"a":"17/2,300 × 1,000 = 7.39‰。"},{"q":"某镇有2,300名居民，去年有17名婴儿出生。求每千名居民的出生率。","o":[],"a":"17/2,300 × 1,000 = 7.39‰。"}],"0:32":[{"q":"百分比變化衡量甚麼？","o":["隨時間發生的相對增長或下降","一個類別相對於另一類別的大小","樣本中某類別的百分比","每千人的事件數"],"a":"隨時間發生的相對增長或下降\n10增至15：增量為5，變動百分比＝5÷10×100＝50%。分母是原值而非新值。"},{"q":"百分比变化衡量什么？","o":["随时间发生的相对增长或下降","一个类别相对于另一类别的大小","样本中某类别的百分比","每千人的事件数"],"a":"随时间发生的相对增长或下降\n10增至15：增量为5，百分比变化＝5÷10×100＝50%。分母是原值而非新值。"}],"0:33":[{"q":"從時期1到時期2的百分比變化公式是甚麼？","o":["(f2- f1) / f1× 100","(f1- f2) / f2 × 100","(f1- f2) / f1 × 100","(f2- f1) / f2× 100"],"a":"(f2- f1) / f1× 100\n百分比變化以原值為基準：(新值 − 原值) ÷ 原值 × 100。"},{"q":"从时期1到时期2的百分比变化公式是什么？","o":["(f2- f1) / f1× 100","(f1- f2) / f2 × 100","(f1- f2) / f1 × 100","(f2- f1) / f2× 100"],"a":"(f2- f1) / f1× 100\n百分比变化以原值为基准：(新值 − 原值) ÷ 原值 × 100。"}],"0:34":[{"q":"謀殺率從7增加至10。求百分比變化，並判斷增加還是減少。","o":[],"a":"((10−7)/7) × 100 = 42.86%，增加。"},{"q":"谋杀率从7增加至10。求百分比变化，并判断增加还是减少。","o":[],"a":"((10−7)/7) × 100 = 42.86%，增加。"}],"0:35":[{"q":"頻數分佈顯示甚麼？","o":["每個類別的個案數","兩個變量之間的關係","兩年之間的變化","樣本與母體的差異"],"a":"每個類別的個案數\n頻數是某類別或數值出現的次數。例如分數 1、1、2、3 → 1 出現 2 次，2 和 3 各出現 1 次。"},{"q":"频数分布显示什么？","o":["每个类别的个案数","两个变量之间的关系","两年之间的变化","样本与总体的差异"],"a":"每个类别的个案数\n频数是某类别或数值出现的次数。例如分数 1、1、2、3 → 1 出现 2 次，2 和 3 各出现 1 次。"}],"0:36":[{"q":"互斥是甚麼意思？","o":["每個個案只能歸入一個類別","每個個案可歸入兩個類別","部分個案不必分類","所有類別頻數相同"],"a":"每個個案只能歸入一個類別\n互斥指類別不重疊。例如整數年齡組 18–20 和 21–23：20 歲只屬於第一組。"},{"q":"互斥是什么意思？","o":["每个个案只能归入一个类别","每个个案可归入两个类别","部分个案不必分类","所有类别频数相同"],"a":"每个个案只能归入一个类别\n互斥指类别不重叠。例如整数年龄组 18–20 和 21–23：20 岁只属于第一组。"}],"0:37":[{"q":"窮盡性是甚麼意思？","o":["每個個案都能歸入某個類別","每個類別大小一樣","每個個案被計算兩次","所有類別必須為數字"],"a":"每個個案都能歸入某個類別\n完備指所有個體均有類別可歸入。例如就業、失業及非勞動人口涵蓋所有勞動狀況。"},{"q":"穷尽性是什么意思？","o":["每个个案都能归入某个类别","每个类别大小一样","每个个案被计算两次","所有类别必须为数字"],"a":"每个个案都能归入某个类别\n完备指所有个体均有类别可归入。例如就业、失业及非劳动力人口涵盖所有劳动状态。"}],"0:38":[{"q":"良好的頻數分佈中，類別應當：","o":["重疊且不完整","互斥且窮盡","頻數相等","僅為連續類別"],"a":"互斥且窮盡\n不重疊，也不遺漏。對連續年齡可採用左閉右開區間，例如 [18,20)、[20,22)、[22,24)；每個數值只會落入一個組別。"},{"q":"良好的频数分布中，类别应当：","o":["重叠且不完整","互斥且穷尽","频数相等","仅为连续类别"],"a":"互斥且穷尽\n不重叠，也不遗漏。对连续年龄可采用左闭右开区间，例如 [18,20)、[20,22)、[22,24)；每个数值只会落入一个组别。"}],"0:39":[{"q":"以下年齡組有甚麼問題：10–20、20–30及30–40（端點均包括）？","o":["類別重疊","類別太小","組距相等","屬於名義尺度"],"a":"類別重疊\n互斥要求類別不重疊；本題的20歲與30歲均可落入兩組。"},{"q":"以下年龄组有什么问题：10–20、20–30及30–40（端点均包括）？","o":["类别重叠","类别太小","组距相等","属于定类尺度"],"a":"类别重叠\n互斥要求类别不重叠；本题的20岁与30岁均可落入两组。"}],"0:40":[{"q":"就業調查只有全職和兼職兩個類別，但部分人失業。違反了哪項原則？","o":["互斥性","窮盡性","等組距","累積頻數"],"a":"窮盡性\n完備要求涵蓋所有個體，但本題遺漏了失業人士。"},{"q":"就业调查只有全职和兼职两个类别，但部分人失业。违反了哪项原则？","o":["互斥性","穷尽性","等组距","累积频数"],"a":"穷尽性\n完备要求涵盖所有个体，但本题遗漏了失业人员。"}],"0:41":[{"q":"哪個組別屬於開口組？","o":["20–29","30–39","40及以上","50–59"],"a":"40及以上\n開口組：40及以上（無上限）；封閉組：40–49（有明確上下限）。"},{"q":"哪个组别属于开口组？","o":["20–29","30–39","40及以上","50–59"],"a":"40及以上\n开口组：40及以上（无上限）；闭口组：40–49（有明确上下限）。"}],"0:42":[{"q":"哪種分佈逐一列出各個不同的分數？","o":["分組頻數分佈","未分組頻數分佈","累積頻數分佈","僅名義變量分佈"],"a":"未分組頻數分佈\n未分組：逐一列出不同數值，例如 1、2、3、4……\n分組：把數值合併為組距，例如 1–10、11–20、21–30。每列記錄其頻數。"},{"q":"哪种分布逐一列出各个不同的分数？","o":["分组频数分布","未分组频数分布","累积频数分布","仅定类变量分布"],"a":"未分组频数分布\n未分组：逐一列出不同数值，例如 1、2、3、4……\n分组：把数值合并为组距，例如 1–10、11–20、21–30。每行记录其频数。"}],"0:43":[{"q":"研究者為何可能將年齡劃分為若干組距？","o":["年齡取值很多","年齡屬於名義尺度","所有人年齡相同","年齡無法測量"],"a":"年齡取值很多\n分組使大量數值更易閱讀。例如年齡 18、19、20、21……可整理為 18–22、23–27 等組別。"},{"q":"研究者为何可能将年龄划分为若干组距？","o":["年龄取值很多","年龄属于定类尺度","所有人年龄相同","年龄无法测量"],"a":"年龄取值很多\n分组使大量数值更易阅读。例如年龄 18、19、20、21……可整理为 18–22、23–27 等组别。"}],"0:44":[{"q":"求組別10–19的組中值。","o":[],"a":"(10+19)/2 = 14.5。"},{"q":"求组别10–19的组中值。","o":[],"a":"(10+19)/2 = 14.5。"}],"0:45":[{"q":"年齡組及頻數：\n18–22：8　｜　23–27：12\n28–32：6　｜　33–37：4\n哪一組是累積頻數？","o":["8, 12, 6, 4","8, 20, 26, 30","8, 20, 18, 10","4, 10, 22, 30"],"a":"8, 20, 26, 30\n累積頻數是逐組加總的頻數：8、8+12=20、20+6=26、26+4=30。"},{"q":"年龄组及频数：\n18–22：8　｜　23–27：12\n28–32：6　｜　33–37：4\n哪一组是累积频数？","o":["8, 12, 6, 4","8, 20, 26, 30","8, 20, 18, 10","4, 10, 22, 30"],"a":"8, 20, 26, 30\n累积频数是逐组加总的频数：8、8+12=20、20+6=26、26+4=30。"}],"0:46":[{"q":"根據表格，哪一組是累積百分比？","o":["26.67%, 40%, 20%, 13.33%","8%, 20%, 26%, 30%","26.67%, 66.67%, 86.67%, 100%","25%, 50%, 75%, 100%"],"a":"26.67%, 66.67%, 86.67%, 100%\n累積百分比＝累積頻數÷總頻數×100%。例如第二組為20÷30×100%≈66.67%。"},{"q":"根据表格，哪一组是累积百分比？","o":["26.67%, 40%, 20%, 13.33%","8%, 20%, 26%, 30%","26.67%, 66.67%, 86.67%, 100%","25%, 50%, 75%, 100%"],"a":"26.67%, 66.67%, 86.67%, 100%\n累积百分比＝累积频数÷总频数×100%。例如第二组为20÷30×100%≈66.67%。"}],"0:47":[{"q":"根據表格，年齡不超過27歲的學生有多少？","o":["12","20","26","30"],"a":"20\n不超過27歲包括前兩組：8+12=20名學生。"},{"q":"根据表格，年龄不超过27岁的学生有多少？","o":["12","20","26","30"],"a":"20\n不超过27岁包括前两组：8+12=20名学生。"}],"0:48":[{"q":"年齡組及頻數：\n18–22：8　｜　23–27：12\n28–32：6　｜　33–37：4\n年齡不超過32歲的學生佔百分之多少？","o":["20%","66.67%","86.67%","100%"],"a":"86.67%\n前三組合共8+12+6=26人，總人數30。百分比＝26÷30×100%≈86.67%。"},{"q":"年龄组及频数：\n18–22：8　｜　23–27：12\n28–32：6　｜　33–37：4\n年龄不超过32岁的学生占百分之多少？","o":["20%","66.67%","86.67%","100%"],"a":"86.67%\n前三组合计8+12+6=26人，总人数30。百分比＝26÷30×100%≈86.67%。"}],"0:49":[{"q":"對於只有少數類別的離散變量，哪種圖表適用？","o":["餅圖","直方圖","僅頻數多邊形圖","散點圖"],"a":"餅圖\n圓形圖：顯示各類別佔整體的比例（如巴士40%、港鐵60%）。條形圖：比較類別，柱間有空隙。直方圖：數值組距，相鄰非空組的柱相連。"},{"q":"对于只有少数类别的离散变量，哪种图表适用？","o":["饼图","直方图","仅频数多边形图","散点图"],"a":"饼图\n饼图：显示各类别占整体的比例（如公交40%、地铁60%）。条形图：比较类别，柱间有空隙。直方图：数值组距，相邻非空组的柱相连。"}],"0:50":[{"q":"對於連續的等距／比率變量，通常哪種圖表最適合？","o":["餅圖","直方圖","僅棒形圖","只有表格沒有圖形"],"a":"直方圖\n直方圖：連續數值（如身高），相鄰非空組的柱相連，沒有空隙（gap）。條形圖：類別或離散計數（如專業），柱間有空隙。圓形圖：各類別佔整體的比例。"},{"q":"对于连续的等距／比率变量，通常哪种图表最适合？","o":["饼图","直方图","仅条形图","只有表格没有图形"],"a":"直方图\n直方图：连续数值（如身高），相邻非空组的柱相连，没有空隙（gap）。条形图：类别或离散计数（如专业），柱间有空隙。饼图：各类别占整体的比例。"}],"0:51":[{"q":"棒形圖與直方圖最明顯的視覺差異是甚麼？","o":["棒形圖的條之間有間隔，直方圖的柱相連","直方圖的柱之間有間隔，棒形圖的條相連","僅棒形圖使用數字","僅直方圖有標題"],"a":"棒形圖的條之間有間隔，直方圖的柱相連\n條形圖：獨立類別（巴士、港鐵）→有空隙；直方圖：相鄰數值組距（[0,10)、[10,20)）→柱相連；零頻數的組會留空。"},{"q":"条形图与直方图最明显的视觉差异是什么？","o":["条形图的条之间有间隔，直方图的柱相连","直方图的柱之间有间隔，条形图的条相连","仅条形图使用数字","仅直方图有标题"],"a":"条形图的条之间有间隔，直方图的柱相连\n条形图：独立类别（公交、地铁）→有空隙；直方图：相邻数值组距（[0,10)、[10,20)）→柱相连；零频数组会留空。"}],"0:52":[{"q":"繪制頻數多邊形圖時，點應標在何處？","o":["各組的組中值處","僅組下限處","餅圖內部","隨機位置"],"a":"各組的組中值處\n組距10–20、頻數8：畫點(15, 8)，橫軸是組中點，縱軸是頻數；再用線連接各點。"},{"q":"绘制频数多边形图时，点应标在何处？","o":["各组的组中值处","仅组下限处","饼图内部","随机位置"],"a":"各组的组中值处\n组距10–20、频数8：画点(15, 8)，横轴是组中点，纵轴是频数；再用线连接各点。"}],"0:53":[{"q":"折線圖顯示2022至2026年每千人的結婚率。哪兩年之間的結婚率下降？","o":["2022至2023年","2023至2024年","2024至2025年","2025至2026年"],"a":"2023至2024年\n後期數值低於前期即為下降：本題由7降至5。"},{"q":"折线图显示2022至2026年每千人的结婚率。哪两年之间的结婚率下降？","o":["2022至2023年","2023至2024年","2024至2025年","2025至2026年"],"a":"2023至2024年\n后期数值低于前期即为下降：本题由7降至5。"}],"0:54":[{"q":"根據折線圖，整體趨勢如何？","o":["持續下降","持續上升且從未下降","整體上升，但2024年下降","整體不變"],"a":"整體上升，但2024年下降\n首末數值由6升至10，整體上升；降至5屬期間的短暫下跌。"},{"q":"根据折线图，整体趋势如何？","o":["持续下降","持续上升且从未下降","整体上升，但2024年下降","整体不变"],"a":"整体上升，但2024年下降\n首末数值由6升至10，整体上升；降至5属期间的短暂下跌。"}],"1:0":[{"q":"集中趨勢主要描述各觀測值之間的距離。","o":["正確","錯誤"],"a":"錯誤\n集中趨勢＝典型數值；離散程度＝分散程度。例如 4、5、6 與 1、5、9 的平均數同為 5，但後者較分散。"},{"q":"集中趋势主要描述各观测值之间的距离。","o":["正确","错误"],"a":"错误\n集中趋势＝典型数值；离散程度＝分散程度。例如 4、5、6 与 1、5、9 的均值同为 5，但后者较分散。"}],"1:1":[{"q":"下列哪項不屬於本課程介紹的集中趨勢度量？","o":["平均數","中位數","眾數","全距"],"a":"全距\n平均數、中位數、眾數描述集中位置；全距描述分散程度。例如2、4、6的平均數為4，全距為6−2＝4。"},{"q":"下列哪项不属于本课程介绍的集中趋势度量？","o":["均值","中位数","众数","极差"],"a":"极差\n均值、中位数、众数描述集中位置；极差描述分散程度。例如2、4、6的均值为4，极差为6−2＝4。"}],"1:2":[{"q":"名義變量最適合使用哪種集中趨勢度量？","o":["平均數","中位數","四分位數","眾數"],"a":"眾數\n眾數＝出現次數最多的數值或類別。例如藍、棕、棕 → 棕色是眾數，毋須數值次序。"},{"q":"定类变量最适合使用哪种集中趋势度量？","o":["均值","中位数","四分位数","众数"],"a":"众数\n众数＝出现次数最多的数值或类别。例如蓝、棕、棕 → 棕色是众数，无需数值次序。"}],"1:3":[{"q":"通常用哪個符號表示母體平均數？","o":["μ","x̄","n","P"],"a":"μ\n母體參數常用希臘字母：母體平均數＝μ，母體標準差＝σ；母體大小則用大寫 N。相對地，樣本平均數常用 x̄，樣本標準差用 s，樣本大小用小寫 n。"},{"q":"通常用哪个符号表示总体均值？","o":["μ","x̄","n","P"],"a":"μ\n总体参数常用希腊字母：总体均值＝μ，总体标准差＝σ；总体大小则用大写 N。相对地，样本均值常用 x̄，样本标准差用 s，样本容量用小写 n。"}],"1:4":[{"q":"通常用哪個符號表示樣本平均數？","o":["N","x̄","μ","D1"],"a":"x̄\nx̄由樣本計算（如50名學生）；μ描述母體（如全校1,000名學生）。"},{"q":"通常用哪个符号表示样本均值？","o":["N","x̄","μ","D1"],"a":"x̄\nx̄由样本计算（如50名学生）；μ描述总体（如全校1,000名学生）。"}],"1:5":[{"q":"某校有1,000名學生，全校平均身高為165釐米，隨機抽取50名學生的平均身高為163釐米。哪個是參數，哪個是統計量？","o":["165釐米是參數；163釐米是統計量","163釐米是參數；165釐米是統計量","兩者都是參數","兩者都是統計量"],"a":"165釐米是參數；163釐米是統計量\n參數描述母體，統計量描述樣本；50名學生是1,000名學生中的一部分。"},{"q":"某校有1,000名学生，全校平均身高为165厘米，随机抽取50名学生的平均身高为163厘米。哪个是参数，哪个是统计量？","o":["165厘米是参数；163厘米是统计量","163厘米是参数；165厘米是统计量","两者都是参数","两者都是统计量"],"a":"165厘米是参数；163厘米是统计量\n参数描述总体，统计量描述样本；50名学生是1,000名学生中的一部分。"}],"1:6":[{"q":"以下哪個是樣本平均數的正確公式？","o":["μ = ΣX ÷ n","x̄ = N ÷ ΣX","x̄ = ΣX ÷ n","x̄ = Σn ÷ X"],"a":"x̄ = ΣX ÷ n\n平均數＝總和 ÷ 個數。例如 (2 + 4 + 6) ÷ 3 = 4。"},{"q":"以下哪个是样本均值的正确公式？","o":["μ = ΣX ÷ n","x̄ = N ÷ ΣX","x̄ = ΣX ÷ n","x̄ = Σn ÷ X"],"a":"x̄ = ΣX ÷ n\n均值＝总和 ÷ 个数。例如 (2 + 4 + 6) ÷ 3 = 4。"}],"1:7":[{"q":"八個城市的搶劫率總和為4,121.6。求平均搶劫率。","o":[],"a":"4,121.6 ÷ 8 = 515.2。"},{"q":"八个城市的抢劫率总和为4,121.6。求平均抢劫率。","o":[],"a":"4,121.6 ÷ 8 = 515.2。"}],"1:8":[{"q":"資料為2、4、6，平均數為4。a. 求離均差之和；b. 求離均差平方和。","o":[],"a":"a. (2−4)+(4−4)+(6−4)=0；b. (2−4)²+(4−4)²+(6−4)²=8。"},{"q":"数据为2、4、6，均值为4。a. 求离均差之和；b. 求离均差平方和。","o":[],"a":"a. (2−4)+(4−4)+(6−4)=0；b. (2−4)²+(4−4)²+(6−4)²=8。"}],"1:9":[{"q":"對任意資料集，所有觀測值與平均數之差的總和為多少？","o":["0","1","樣本大小n","無法確定"],"a":"0\n各數值與平均數的離差互相抵銷。例如 2、4、6 的平均數為 4；離差 −2、0、+2 的總和為 0。"},{"q":"对任意数据集，所有观测值与均值之差的总和为多少？","o":["0","1","样本容量n","无法确定"],"a":"0\n各数值与均值的离差相互抵消。例如 2、4、6 的均值为 4；离差 −2、0、+2 的总和为 0。"}],"1:10":[{"q":"資料集中加入一個極大的數值後，哪項度量通常變化最大？","o":["平均數","中位數","眾數","測量尺度"],"a":"平均數\n平均數使用所有數值；中位數取排序後的中央值。例如 2、3、100 → 平均數 35，中位數 3。極端值拉高平均數。"},{"q":"数据集中加入一个极大的数值后，哪项度量通常变化最大？","o":["均值","中位数","众数","测量尺度"],"a":"均值\n均值使用所有数值；中位数取排序后的中央值。例如 2、3、100 → 均值 35，中位数 3。极端值拉高均值。"}],"1:11":[{"q":"最高收入組是開口組（例如20萬美元及以上）時，為何通常無法精確計算平均數？","o":["該組頻數必為0","收入變量不能用平均數","開口組內的確切數值未知","資料未排序"],"a":"開口組內的確切數值未知\n「100及以上」的數值可能是101或1,000。不知道實際數值或總和便不能求準確平均數，亦無法定出組中點。"},{"q":"最高收入组是开口组（例如20万美元及以上）时，为何通常无法精确计算均值？","o":["该组频数必为0","收入变量不能用均值","开口组内的确切数值未知","数据未排序"],"a":"开口组内的确切数值未知\n“100及以上”的数值可能是101或1,000。不知道实际数值或总和便不能求准确均值，也无法确定组中点。"}],"1:12":[{"q":"資料為2、4、6，平均數為4。a. 求相對於4的離差平方和；b. 求相對於3的離差平方和。","o":[],"a":"a. (2−4)²+(4−4)²+(6−4)²=8；b. (2−3)²+(4−3)²+(6−3)²=11。平均數4使平方和更小。"},{"q":"数据为2、4、6，均值为4。a. 求相对于4的离差平方和；b. 求相对于3的离差平方和。","o":[],"a":"a. (2−4)²+(4−4)²+(6−4)²=8；b. (2−3)²+(4−3)²+(6−3)²=11。均值4使平方和更小。"}],"1:13":[{"q":"一組身高資料近似對稱、沒有離群值，且用於進一步統計分析。應優先採用哪種度量？","o":["平均數","眾數","開口組","僅最小值"],"a":"平均數\n平均數使用所有身高數值；中位數取中央位置，遇到極端值時較合適；眾數適合找最常見的類別。"},{"q":"一组身高数据近似对称、没有离群值，且用于进一步统计分析。应优先采用哪种度量？","o":["均值","众数","开口组","仅最小值"],"a":"均值\n均值使用所有身高数值；中位数取中央位置，遇到极端值时更合适；众数适合找最常见的类别。"}],"1:14":[{"q":"以下哪個是加權平均數的正確公式？","o":["x̄w = ΣX ÷ Σw","x̄w = Σ(wX) ÷ Σw","x̄w = Σw ÷ ΣX","x̄w = Σ(w + X) ÷ n"],"a":"x̄w = Σ(wX) ÷ Σw\n加權平均數＝加權總和 ÷ 權數總和。例如 60 分出現兩次、90 分出現一次：(60 × 2 + 90 × 1) ÷ 3 = 70。"},{"q":"以下哪个是加权均值的正确公式？","o":["x̄w = ΣX ÷ Σw","x̄w = Σ(wX) ÷ Σw","x̄w = Σw ÷ ΣX","x̄w = Σ(w + X) ÷ n"],"a":"x̄w = Σ(wX) ÷ Σw\n加权均值＝加权总和 ÷ 权数总和。例如 60 分出现两次、90 分出现一次：(60 × 2 + 90 × 1) ÷ 3 = 70。"}],"1:15":[{"q":"在頻數資料中，權重w通常代表甚麼？","o":["數值的排名","測量單位","該數值的頻數","母體平均數"],"a":"該數值的頻數\n加權平均數＝加權總和 ÷ 權數總和。例如 60 分出現兩次、90 分出現一次：(60 × 2 + 90 × 1) ÷ 3 = 70。"},{"q":"在频数数据中，权重w通常代表什么？","o":["数值的排名","测量单位","该数值的频数","总体均值"],"a":"该数值的频数\n加权均值＝加权总和 ÷ 权数总和。例如 60 分出现两次、90 分出现一次：(60 × 2 + 90 × 1) ÷ 3 = 70。"}],"1:16":[{"q":"餐廳售出3杯單價0.90美元、4杯單價1.25美元及3杯單價1.50美元的飲品。求加權平均售價。","o":["USD 1.20","USD 1.22","USD 1.25","USD 1.50"],"a":"USD 1.22\n加權平均數＝總售價÷總杯數＝(3×0.90+4×1.25+3×1.50)÷10＝1.22美元。"},{"q":"餐厅售出3杯单价0.90美元、4杯单价1.25美元及3杯单价1.50美元的饮品。求加权平均售价。","o":["USD 1.20","USD 1.22","USD 1.25","USD 1.50"],"a":"USD 1.22\n加权均值＝总售价÷总杯数＝(3×0.90+4×1.25+3×1.50)÷10＝1.22美元。"}],"1:17":[{"q":"某課程作業佔30%、測驗佔30%、考試佔40%，學生得分分別為80、70、90。求加權總成績。","o":["78","80","81","90"],"a":"81\n各項分數乘以相應權重後相加：80×0.30+70×0.30+90×0.40=81。"},{"q":"某课程作业占30%、测验占30%、考试占40%，学生得分分别为80、70、90。求加权总成绩。","o":["78","80","81","90"],"a":"81\n各项分数乘以相应权重后相加：80×0.30+70×0.30+90×0.40=81。"}],"1:18":[{"q":"計算中位數之前必須做甚麼？","o":["將資料排序","計算每個離差","刪除所有極端值","將每個數值乘以權重"],"a":"將資料排序\n中位數＝排序後的中央值。例如 9、1、5 → 1、5、9 → 中位數＝5。"},{"q":"计算中位数之前必须做什么？","o":["将数据排序","计算每个离差","删除所有极端值","将每个数值乘以权重"],"a":"将数据排序\n中位数＝排序后的中央值。例如 9、1、5 → 1、5、9 → 中位数＝5。"}],"1:19":[{"q":"求10、10、8、7、5、4、2、1的中位數。","o":["5","6","7","7 和 5"],"a":"6\n排序後中間兩項為5和7，平均為 (5+7)÷2＝6。寫成 (7+5)÷2 也完全相同，因為加法次序不影響結果。"},{"q":"求10、10、8、7、5、4、2、1的中位数。","o":["5","6","7","7 和 5"],"a":"6\n排序后中间两项为5和7，平均为 (5+7)÷2＝6。写成 (7+5)÷2 也完全相同，因为加法次序不影响结果。"}],"1:20":[{"q":"中位數通常比平均數更不容易受極端值影響。","o":["正確","錯誤"],"a":"正確\n平均數使用所有數值；中位數取排序後的中央值。例如 2、3、100 → 平均數 35，中位數 3。極端值拉高平均數。"},{"q":"中位数通常比均值更不容易受极端值影响。","o":["正确","错误"],"a":"正确\n均值使用所有数值；中位数取排序后的中央值。例如 2、3、100 → 均值 35，中位数 3。极端值拉高均值。"}],"1:21":[{"q":"計算中位數通常最低需要哪種測量尺度？","o":["名義尺度","不需要任何測量尺度","順序尺度","僅比率尺度"],"a":"順序尺度\n中位數需要有次序。例如差、普通、好可以排序並找出中央類別；眼睛顏色則無自然次序。"},{"q":"计算中位数通常最低需要哪种测量尺度？","o":["定类尺度","不需要任何测量尺度","定序尺度","仅比率尺度"],"a":"定序尺度\n中位数需要有次序。例如差、一般、好可以排序并找出中央类别；眼睛颜色则无自然次序。"}],"1:22":[{"q":"只要類別足夠多，就能計算名義變量的中位數。","o":["正確","錯誤"],"a":"錯誤\n中位數需要有次序。例如差、普通、好可以排序並找出中央類別；眼睛顏色則無自然次序。"},{"q":"只要类别足够多，就能计算定类变量的中位数。","o":["正确","错误"],"a":"错误\n中位数需要有次序。例如差、一般、好可以排序并找出中央类别；眼睛颜色则无自然次序。"}],"1:23":[{"q":"當頻數分佈存在開口組時，甚麼情況下仍能確定中位數？","o":["開口組頻數必須為0","樣本大小必須為偶數","所有組頻數相同","中位數不落在開口組內"],"a":"中位數不落在開口組內\n中位數取決於中央位置，若中央位置不在開放組內，仍可確定中位數所在組別。"},{"q":"当频数分布存在开口组时，什么情况下仍能确定中位数？","o":["开口组频数必须为0","样本容量必须为偶数","所有组频数相同","中位数不落在开口组内"],"a":"中位数不落在开口组内\n中位数取决于中央位置，若中央位置不在开放组内，仍可确定中位数所在组别。"}],"1:24":[{"q":"收入分佈呈明顯右偏，且有少數極高收入。哪種集中趨勢的度量較適合？","o":["平均數","中位數"],"a":"中位數\n平均數使用所有數值；中位數取排序後的中央值。例如 2、3、100 → 平均數 35，中位數 3。極端值拉高平均數。"},{"q":"收入分布呈明显右偏，且有少数极高收入。哪种集中趋势的度量较适合？","o":["均值","中位数"],"a":"中位数\n均值使用所有数值；中位数取排序后的中央值。例如 2、3、100 → 均值 35，中位数 3。极端值拉高均值。"}],"1:25":[{"q":"滿意度分為非常不滿意、不滿意、中立、滿意、非常滿意。報告中心類別時應優先使用哪項？","o":["全距","中位數","變異數","僅平均數"],"a":"中位數\n滿意程度可排序（不滿意→中立→滿意），但差距不可量度；中位數只需次序，平均數則需要有意義的數值差距。"},{"q":"满意度分为非常不满意、不满意、中立、满意、非常满意。报告中心类别时应优先使用哪项？","o":["极差","中位数","方差","仅均值"],"a":"中位数\n满意程度可排序（不满意→中立→满意），但差距不可测量；中位数只需顺序，均值则需要有意义的数值差距。"}],"1:26":[{"q":"第P百分位數代表甚麼？","o":["P個觀測值的平均數","最高的P個觀測值","資料由小到大排列後，該數值高於約P%的觀測值","資料總和的P%"],"a":"資料由小到大排列後，該數值高於約P%的觀測值\n先把資料由小到大排列。第P百分位數所在位置的數值，高於約P%的觀測值。例如某分數位於P80，表示它高於約80%的分數；同分會影響實際比例。"},{"q":"第P百分位数代表什么？","o":["P个观测值的均值","最高的P个观测值","数据从小到大排列后，该数值高于约P%的观测值","数据总和的P%"],"a":"数据从小到大排列后，该数值高于约P%的观测值\n先把数据从小到大排列。第P百分位数所在位置的数值，高于约P%的观测值。例如某分数位于P80，表示它高于约80%的分数；同分会影响实际比例。"}],"1:27":[{"q":"第一四分位數Q1對應哪個百分位數？","o":["第25百分位數","第50百分位數","第75百分位數","第100百分位數"],"a":"第25百分位數\n四分位數將排序資料分為四份；Q1對應第25百分位數。"},{"q":"第一四分位数Q1对应哪个百分位数？","o":["第25百分位数","第50百分位数","第75百分位数","第100百分位数"],"a":"第25百分位数\n四分位数将排序数据分为四份；Q1对应第25百分位数。"}],"1:28":[{"q":"第二四分位數Q2等於甚麼？","o":["眾數","中位數","最大值","平均數"],"a":"中位數\nQ2是第50百分位數，即排序資料的中央位置。"},{"q":"第二四分位数Q2等于什么？","o":["众数","中位数","最大值","均值"],"a":"中位数\nQ2是第50百分位数，即排序数据的中央位置。"}],"1:29":[{"q":"約有多少百分比的觀測值低於第八十分位數D8？","o":["8%","20%","50%","80%"],"a":"80%\n十分位數將排序資料分為十份；D8對應第80百分位數。"},{"q":"约有多少百分比的观测值低于第八十分位数D8？","o":["8%","20%","50%","80%"],"a":"80%\n十分位数将排序数据分为十份；D8对应第80百分位数。"}],"1:30":[{"q":"本課程採用哪個公式確定百分位數的位置？","o":["Lp = (n + 1)(P ÷ 100)","Lp = n ÷ P","Lp = ΣX ÷ n","Lp = P − n"],"a":"Lp = (n + 1)(P ÷ 100)\nn=19時，P25位置＝(19+1)×0.25＝5。再找排序後第5個數值；位置5不一定等於分數5。"},{"q":"本课程采用哪个公式确定百分位数的位置？","o":["Lp = (n + 1)(P ÷ 100)","Lp = n ÷ P","Lp = ΣX ÷ n","Lp = P − n"],"a":"Lp = (n + 1)(P ÷ 100)\nn=19时，P25位置＝(19+1)×0.25＝5。再找排序后第5个数值；位置5不一定等于分数5。"}],"1:31":[{"q":"15名代理人的傭金按順序排列，第8個數值為2,038。用本課程公式求中位數。","o":[],"a":"L50=(15+1)(50/100)=8；中位數=2,038。"},{"q":"15名代理人的佣金按顺序排列，第8个数值为2,038。用本课程公式求中位数。","o":[],"a":"L50=(15+1)(50/100)=8；中位数=2,038。"}],"1:32":[{"q":"15個傭金數值已由小到大排列，第4個數值為1,721。哪個算式能正確找出Q1的位置？","o":["(15 + 1) × 0.25 = 4","15 × 0.25 = 3.75","(15 + 1) × 0.50 = 8","(15 − 1) × 0.25 = 3.5"],"a":"(15 + 1) × 0.25 = 4\n使用 L25＝(n+1)×0.25，因此Q1在第4個位置；確定位置後才讀取第4個數值1,721。重點是位置公式，而不是直接從題目抄出數值。"},{"q":"15个佣金数值已从小到大排列，第4个数值为1,721。哪个算式能正确找出Q1的位置？","o":["(15 + 1) × 0.25 = 4","15 × 0.25 = 3.75","(15 + 1) × 0.50 = 8","(15 − 1) × 0.25 = 3.5"],"a":"(15 + 1) × 0.25 = 4\n使用 L25＝(n+1)×0.25，因此Q1在第4个位置；确定位置后才读取第4个数值1,721。重点是位置公式，而不是直接从题目抄出数值。"}],"1:33":[{"q":"同一組15個已排序傭金數值中，第12個為2,205。求Q3。","o":[],"a":"L75=(15+1)(75/100)=12；Q3=2,205。"},{"q":"同一组15个已排序佣金数值中，第12个为2,205。求Q3。","o":[],"a":"L75=(15+1)(75/100)=12；Q3=2,205。"}],"1:34":[{"q":"樣本大小n=19，用本課程公式求第50百分位數的位置L50。","o":[],"a":"L50=(19+1)(50/100)=10，即第10個位置。"},{"q":"样本容量n=19，用本课程公式求第50百分位数的位置L50。","o":[],"a":"L50=(19+1)(50/100)=10，即第10个位置。"}],"1:35":[{"q":"樣本大小n=19，用本課程公式求Q1的位置。","o":[],"a":"L25=(19+1)(25/100)=5，即第5個位置。"},{"q":"样本容量n=19，用本课程公式求Q1的位置。","o":[],"a":"L25=(19+1)(25/100)=5，即第5个位置。"}],"1:36":[{"q":"某人的成績位於第80百分位數。哪項解釋最準確？","o":["此人答對了80%的題目","約80%的成績低於該位置","此人成績必為80分","此人同時屬於最低20%與最高80%"],"a":"約80%的成績低於該位置\n位於P80表示約80%分數較低、20%較高（須考慮同分），不表示考了80分。"},{"q":"某人的成绩位于第80百分位数。哪项解释最准确？","o":["此人答对了80%的题目","约80%的成绩低于该位置","此人成绩必为80分","此人同时属于最低20%与最高80%"],"a":"约80%的成绩低于该位置\n位于P80表示约80%分数较低、20%较高（须考虑同分），不表示考了80分。"}],"1:37":[{"q":"Q1、Q2和Q3將排序資料劃分為四部分。","o":["正確","錯誤"],"a":"正確\nQ1、Q2及Q3分別對應第25、50及75百分位數。"},{"q":"Q1、Q2和Q3将排序数据划分为四部分。","o":["正确","错误"],"a":"正确\nQ1、Q2及Q3分别对应第25、50及75百分位数。"}],"1:38":[{"q":"甚麼是眾數？","o":["出現頻數最高的數值或類別","排序後居中的數值","所有數值的平平均數","最大值和最小值的平平均數"],"a":"出現頻數最高的數值或類別\n眾數＝出現次數最多的數值或類別。例如藍、棕、棕 → 棕色是眾數，毋須數值次序。"},{"q":"什么是众数？","o":["出现频数最高的数值或类别","排序后居中的数值","所有数值的平均值","最大值和最小值的平均值"],"a":"出现频数最高的数值或类别\n众数＝出现次数最多的数值或类别。例如蓝、棕、棕 → 棕色是众数，无需数值次序。"}],"1:39":[{"q":"棒形圖中通常哪一項代表眾數？","o":["最左邊的條","最右邊的條","最高的條","所有條的平均高度"],"a":"最高的條\n若巴士頻數12、港鐵20，港鐵柱較高，眾數是港鐵。眾數看出現次數，不是數值大小。"},{"q":"条形图中通常哪一项代表众数？","o":["最左边的条","最右边的条","最高的条","所有条的平均高度"],"a":"最高的条\n若公交频数12、地铁20，地铁柱更高，众数是地铁。众数看出现次数，不是数值大小。"}],"1:40":[{"q":"哪組資料沒有明確的單一眾數？","o":["1, 1, 2, 3","1, 2, 3, 4","2, 2, 2, 3","4, 4, 5, 6"],"a":"1, 2, 3, 4\n四個數值均只出現一次，因此沒有唯一頻數最高的數值。"},{"q":"哪组数据没有明确的单一众数？","o":["1, 1, 2, 3","1, 2, 3, 4","2, 2, 2, 3","4, 4, 5, 6"],"a":"1, 2, 3, 4\n四个数值均只出现一次，因此没有唯一频数最高的数值。"}],"1:41":[{"q":"何時資料集會有多個眾數？","o":["多個數值並列最高頻數","資料已排序","樣本大小為奇數","平均數等於中位數"],"a":"多個數值並列最高頻數\n多眾數指多個數值同時具有最高頻數。例如 1、1、2、2、3 → 兩個眾數：1 和 2。"},{"q":"何时数据集会有多个众数？","o":["多个数值并列最高频数","数据已排序","样本容量为奇数","均值等于中位数"],"a":"多个数值并列最高频数\n多众数指多个数值同时具有最高频数。例如 1、1、2、2、3 → 两个众数：1 和 2。"}],"1:42":[{"q":"加入單個極大的觀測值，通常不會改變眾數。","o":["正確","錯誤"],"a":"正確\n2、2、3的眾數為2；加入100後眾數仍為2，但平均數上升。眾數看頻數，不看數值大小。"},{"q":"加入单个极大的观测值，通常不会改变众数。","o":["正确","错误"],"a":"正确\n2、2、3的众数为2；加入100后众数仍为2，但均值上升。众数看频数，不看数值大小。"}],"1:43":[{"q":"調查居民最喜歡的交通方式：巴士、港鐵、私家車或步行。應報告哪種集中趨勢度量？","o":["平均數","中位數","眾數","第75百分位數"],"a":"眾數\n眾數＝出現次數最多的數值或類別。例如藍、棕、棕 → 棕色是眾數，毋須數值次序。"},{"q":"调查居民最喜欢的交通方式：巴士、港铁、私家车或步行。应报告哪种集中趋势度量？","o":["均值","中位数","众数","第75百分位数"],"a":"众数\n众数＝出现次数最多的数值或类别。例如蓝、棕、棕 → 棕色是众数，无需数值次序。"}],"1:44":[{"q":"哪種分佈屬於右偏分佈？","o":["右側有較長尾部的分佈","左側有較長尾部的分佈"],"a":"右側有較長尾部的分佈\n正偏態指右尾較長。例如收入 10、11、12、13、100：少數高收入拉長右尾。"},{"q":"哪种分布属于右偏分布？","o":["右侧有较长尾部的分布","左侧有较长尾部的分布"],"a":"右侧有较长尾部的分布\n正偏态指右尾较长。例如收入 10、11、12、13、100：少数高收入拉长右尾。"}],"1:45":[{"q":"在典型負偏（左偏）分佈中，三種集中趨勢度量的關係是甚麼？","o":["平均數 > 中位數 > 眾數","平均數 > 眾數 > 中位數","眾數 > 中位數 > 平均數","三者必然相等"],"a":"眾數 > 中位數 > 平均數\n左長尾把平均數拉向左：典型單峰左偏為平均數＜中位數＜眾數；右偏通常相反。"},{"q":"在典型负偏（左偏）分布中，三种集中趋势度量的关系是什么？","o":["均值 > 中位数 > 众数","均值 > 众数 > 中位数","众数 > 中位数 > 均值","三者必然相等"],"a":"众数 > 中位数 > 均值\n左长尾把均值拉向左：典型单峰左偏为均值＜中位数＜众数；右偏通常相反。"}],"1:46":[{"q":"少數極高觀測值通常將平均數拉向哪個方向？","o":["向左或較小值","向右或較大值","不會改變","必然等於眾數"],"a":"向右或較大值\n2、3、4的平均數是3；把4換成100，平均數升至35，中位數仍為3。高極端值將平均數拉向右。"},{"q":"少数极高观测值通常将均值拉向哪个方向？","o":["向左或较小值","向右或较大值","不会改变","必然等于众数"],"a":"向右或较大值\n2、3、4的均值是3；把4换成100，均值升至35，中位数仍为3。高极端值将均值拉向右。"}],"1:47":[{"q":"在典型正偏分佈中，平均數大於中位數。","o":["正確","錯誤"],"a":"正確\n典型正偏態分布的高極端值會將平均數拉至中位數以上，但並非所有分布都必然如此。"},{"q":"在典型正偏分布中，均值大于中位数。","o":["正确","错误"],"a":"正确\n典型正偏态分布的高极端值会将均值拉至中位数以上，但并非所有分布都必然如此。"}],"1:48":[{"q":"分佈的眾數為60、中位數為50、平均數為40。最可能是哪種分佈？","o":["正偏","負偏","對稱","均勻"],"a":"負偏\n典型單峰分布中，平均數低於中位數及眾數，通常表示長尾向左。"},{"q":"分布的众数为60、中位数为50、均值为40。最可能是哪种分布？","o":["正偏","负偏","对称","均匀"],"a":"负偏\n典型单峰分布中，均值低于中位数及众数，通常表示长尾向左。"}],"1:49":[{"q":"在高度偏態分佈中，為何中位數通常比平均數更能代表典型數值？","o":["較少受極端值影響","始終等於平均數","計算時使用每個數值"],"a":"較少受極端值影響\n平均數使用所有數值；中位數取排序後的中央值。例如 2、3、100 → 平均數 35，中位數 3。極端值拉高平均數。"},{"q":"在高度偏态分布中，为何中位数通常比均值更能代表典型数值？","o":["较少受极端值影响","始终等于均值","计算时使用每个数值"],"a":"较少受极端值影响\n均值使用所有数值；中位数取排序后的中央值。例如 2、3、100 → 均值 35，中位数 3。极端值拉高均值。"}],"1:50":[{"q":"某區房價明顯右偏，少量房產價格極高。哪項度量最能反映典型房價？","o":["最大值","平均數","加權總和","中位數"],"a":"中位數\n平均數使用所有數值；中位數取排序後的中央值。例如 2、3、100 → 平均數 35，中位數 3。極端值拉高平均數。"},{"q":"某区房价明显右偏，少量房产价格极高。哪项度量最能反映典型房价？","o":["最大值","均值","加权总和","中位数"],"a":"中位数\n均值使用所有数值；中位数取排序后的中央值。例如 2、3、100 → 均值 35，中位数 3。极端值拉高均值。"}],"1:54":[{"q":"一個變量可能有：","o":["一個眾數","多個眾數","沒有眾數","以上皆是"],"a":"以上皆是\n眾數的個數由頻數決定：可有多個數值並列最高頻數，也可能沒有明顯眾數。"},{"q":"一个变量可能有：","o":["一个众数","多个众数","没有众数","以上皆是"],"a":"以上皆是\n众数的个数由频数决定：可有多个数值并列最高频数，也可能没有明显众数。"}],"1:57":[{"q":"學生考試成績位於第85百分位數，這意味著甚麼？","o":["約85%的考生成績低於該學生","約15%的考生成績高於該學生","以上兩項均不正確","以上前兩項均正確"],"a":"以上前兩項均正確\n第85百分位數表示約85%的觀察值在其下方、15%在其上方（不考慮相同數值）。"},{"q":"学生考试成绩位于第85百分位数，这意味着什么？","o":["约85%的考生成绩低于该学生","约15%的考生成绩高于该学生","以上两项均不正确","以上前两项均正确"],"a":"以上前两项均正确\n第85百分位数表示约85%的观察值在其下方、15%在其上方（不考虑相同数值）。"}],"2:0":[{"q":"已排序資料為5、7、8、10、12、13、15、18、20、22、25，共11個觀測值。使用0.25(n+1)和0.75(n+1)確定Q1、Q3的位置，並求Q1、Q3及四分位距。","o":[],"a":"Q1位置=0.25(11+1)=3，Q1=8；Q3位置=0.75(11+1)=9，Q3=20；四分位距=20−8=12。"},{"q":"已排序数据为5、7、8、10、12、13、15、18、20、22、25，共11个观测值。使用0.25(n+1)和0.75(n+1)确定Q1、Q3的位置，并求Q1、Q3及四分位距。","o":[],"a":"Q1位置=0.25(11+1)=3，Q1=8；Q3位置=0.75(11+1)=9，Q3=20；四分位距=20−8=12。"}],"2:1":[{"q":"平均離差的公式為Σ｜X−x̄｜/n。絕對值符號的作用是甚麼？","o":["對每個離差平方","防止正負離差相互抵消","使平均離差等於零","消除極端值的影響"],"a":"防止正負離差相互抵消\n絕對值避免正負離差互相抵銷。例如 −3 與 +3 相加為 0，但 |−3| + |3| = 6。"},{"q":"平均离差的公式为Σ｜X−x̄｜/n。绝对值符号的作用是什么？","o":["对每个离差平方","防止正负离差相互抵消","使平均离差等于零","消除极端值的影响"],"a":"防止正负离差相互抵消\n绝对值避免正负离差相互抵消。例如 −3 与 +3 相加为 0，但 |−3| + |3| = 6。"}],"2:2":[{"q":"求6、8、10、12、14的平均數及平均離差。","o":[],"a":"平均數=(6+8+10+12+14)/5=10；平均離差=(4+2+0+2+4)/5=2.4。"},{"q":"求6、8、10、12、14的均值及平均离差。","o":[],"a":"均值=(6+8+10+12+14)/5=10；平均离差=(4+2+0+2+4)/5=2.4。"}],"2:3":[{"q":"某工廠連續四天記錄的不合格品數為3、5、4、8。將這四天視為母體，求標準差。","o":["1.87","2.16","3.50","5.00"],"a":"1.87\n母體平均數＝5；母體變異數＝(4+0+1+9)÷4＝3.5；σ＝√3.5≈1.87。"},{"q":"某工厂连续四天记录的不合格品数为3、5、4、8。将这四天视为总体，求标准差。","o":["1.87","2.16","3.50","5.00"],"a":"1.87\n总体均值＝5；总体方差＝(4+0+1+9)÷4＝3.5；σ＝√3.5≈1.87。"}],"2:4":[{"q":"六名學生每周學習時間分別為5、7、7、8、10、11小時。求樣本變異數與樣本標準差。","o":[],"a":"x̄=8小時；s²=[9+1+1+0+4+9]/(6−1)=4.8小時²；s=√4.8≈2.19小時。"},{"q":"六名学生每周学习时间分别为5、7、7、8、10、11小时。求样本方差与样本标准差。","o":[],"a":"x̄=8小时；s²=[9+1+1+0+4+9]/(6−1)=4.8小时²；s=√4.8≈2.19小时。"}],"2:5":[{"q":"資料集A和B的平均數均為15.5，標準差分別為3.34和0.93。哪個資料集更集中？","o":["資料集A","資料集B"],"a":"資料集B\n平均數相同，分散程度不同：B的標準差0.93小於A的3.34，因此B較集中在15.5附近。"},{"q":"数据集A和B的均值均为15.5，标准差分别为3.34和0.93。哪个数据集更集中？","o":["数据集A","数据集B"],"a":"数据集B\n均值相同，分散程度不同：B的标准差0.93小于A的3.34，因此B更集中在15.5附近。"}],"2:6":[{"q":"兩個具有相同平均數的正態分佈：A的曲線較窄，B的曲線較寬且較平坦。哪個分佈的標準差較大？","o":["分佈A","分佈B"],"a":"分佈B\n平均數相同＝中心相同。標準差越大，曲線越寬越扁；越小則越窄越高（總面積仍為1）。"},{"q":"两个具有相同均值的正态分布：A的曲线较窄，B的曲线较宽且较平坦。哪个分布的标准差较大？","o":["分布A","分布B"],"a":"分布B\n均值相同＝中心相同。标准差越大，曲线越宽越扁；越小则越窄越高（总面积仍为1）。"}],"2:7":[{"q":"以下哪種情況不應使用相對離散程度指標（變異係數）？","o":["評估兩家公司的相對薪資差異","比較兩台機器處理時間的相對穩定性","比較兩項投資收益的相對風險","計算一個班考試成績的絕對差異"],"a":"計算一個班考試成績的絕對差異\n標準差描述絕對分散程度（如5分）；CV＝標準差÷平均數×100%，描述相對分散程度（如5/50＝10%）。比較正平均數的比率尺度資料時可用CV。"},{"q":"以下哪种情况不应使用相对离散程度指标（变异系数）？","o":["评估两家公司的相对薪资差异","比较两台机器处理时间的相对稳定性","比较两项投资收益的相对风险","计算一个班考试成绩的绝对差异"],"a":"计算一个班考试成绩的绝对差异\n标准差描述绝对离散程度（如5分）；CV＝标准差÷均值×100%，描述相对离散程度（如5/50＝10%）。比较正均值的等比尺度数据时可用CV。"}],"2:8":[{"q":"A公司平均月薪25,000港元，標準差3,000港元；B公司平均月薪12,000港元，標準差1,800港元。求各公司的變異係數，並判斷哪家公司相對薪資差異更大。","o":[],"a":"CV(A)=3,000/25,000×100%=12%；CV(B)=1,800/12,000×100%=15%。B相對差異更大。"},{"q":"A公司平均月薪25,000港元，标准差3,000港元；B公司平均月薪12,000港元，标准差1,800港元。求各公司的变异系数，并判断哪家公司相对薪资差异更大。","o":[],"a":"CV(A)=3,000/25,000×100%=12%；CV(B)=1,800/12,000×100%=15%。B相对差异更大。"}],"2:9":[{"q":"機器A平均處理時間40秒，標準差2秒；機器B平均處理時間75秒，標準差3秒。哪台機器的處理時間相對更穩定？","o":["機器A","機器B"],"a":"機器B\n變異系數 = 標準差 ÷ 平均數 × 100：A為5%，B為4%。數值越小，相對離散程度越低。"},{"q":"机器A平均处理时间40秒，标准差2秒；机器B平均处理时间75秒，标准差3秒。哪台机器的处理时间相对更稳定？","o":["机器A","机器B"],"a":"机器B\n变异系数 = 标准差 ÷ 均值 × 100：A为5%，B为4%。数值越小，相对离散程度越低。"}],"2:10":[{"q":"投資組合的平均年收益率為8%，標準差為12%。求變異係數並解釋。","o":[],"a":"CV=12%/8%×100%=150%。標準差是平均數的1.5倍，表示相對波動（風險）較高。"},{"q":"投资组合的平均年收益率为8%，标准差为12%。求变异系数并解释。","o":[],"a":"CV=12%/8%×100%=150%。标准差是均值的1.5倍，表示相对波动（风险）较高。"}],"2:11":[{"q":"切比雪夫定理適用於：","o":["任何具有有限變異數的分佈","僅近似鐘形分佈","僅對稱分佈","僅正態分佈"],"a":"任何具有有限變異數的分佈\n切比雪夫：任何形狀（有有限變異數），2個標準差內至少75%；經驗法則：近似常態才適用，2個標準差內約95%。"},{"q":"切比雪夫定理适用于：","o":["任何具有有限方差的分布","仅近似钟形分布","仅对称分布","仅正态分布"],"a":"任何具有有限方差的分布\n切比雪夫：任何形状（有有限方差），2个标准差内至少75%；经验法则：近似正态才适用，2个标准差内约95%。"}],"2:12":[{"q":"資料集的平均數為50，標準差為6。根據切比雪夫定理，至少多少比例的資料位於38至62之間？","o":["50%","68%","75%","95%"],"a":"75%\n兩端距平均數2個標準差：k=(62−50)/6=2。切比雪夫定理：至少1−1/k²=75%。"},{"q":"数据集的均值为50，标准差为6。根据切比雪夫定理，至少多少比例的数据位于38至62之间？","o":["50%","68%","75%","95%"],"a":"75%\n两端距均值2个标准差：k=(62−50)/6=2。切比雪夫定理：至少1−1/k²=75%。"}],"2:13":[{"q":"某分佈的平均數為120，標準差為15。至少約88.9%的觀測值位於哪個區間？","o":[],"a":"1−1/3²≈88.9%，k=3；120±3(15)=[75,165]。"},{"q":"某分布的均值为120，标准差为15。至少约88.9%的观测值位于哪个区间？","o":[],"a":"1−1/3²≈88.9%，k=3；120±3(15)=[75,165]。"}],"2:14":[{"q":"要保證至少96%的觀測值位於平均數附近，需要在平均數上下各取多少個標準差？","o":["2","3","4","5"],"a":"5\n切比雪夫定理：1−1/k²=0.96，因此k²=25，k=5。"},{"q":"要保证至少96%的观测值位于均值附近，需要在均值上下各取多少个标准差？","o":["2","3","4","5"],"a":"5\n切比雪夫定理：1−1/k²=0.96，因此k²=25，k=5。"}],"2:15":[{"q":"經驗法則適用於：","o":["任何分佈","近似對稱的鐘形分佈","僅偏態分佈","僅名義變量"],"a":"近似對稱的鐘形分佈\n經驗法則：近似常態，1／2／3個標準差內約68%／95%／99.7%。切比雪夫也適用其他形狀，但給出最低比例。"},{"q":"经验法则适用于：","o":["任何分布","近似对称的钟形分布","仅偏态分布","仅定类变量"],"a":"近似对称的钟形分布\n经验法则：近似正态，1／2／3个标准差内约68%／95%／99.7%。切比雪夫也适用其他形状，但给出最低比例。"}],"2:16":[{"q":"一個鐘形分佈的平均數為70，標準差為5。約有多少比例的資料位於60至80之間？","o":["68%","75%","95%","99.7%"],"a":"95%\n60及80為70±2×5。經驗法則：鐘形分布約95%的資料位於平均數上下2個標準差。"},{"q":"一个钟形分布的均值为70，标准差为5。约有多少比例的数据位于60至80之间？","o":["68%","75%","95%","99.7%"],"a":"95%\n60和80为70±2×5。经验法则：钟形分布约95%的数据位于均值上下2个标准差。"}],"2:17":[{"q":"某近似鐘形分佈的觀測值幾乎全部位於25至85之間。使用全距約為6個標準差的規則估計標準差。","o":["5","10","15","60"],"a":"10\n按題目指定的全距法則，標準差≈(85−25)÷6=10。"},{"q":"某近似钟形分布的观测值几乎全部位于25至85之间。使用极差约为6个标准差的规则估计标准差。","o":["5","10","15","60"],"a":"10\n按题目指定的极差法则，标准差≈(85−25)÷6=10。"}],"2:18":[{"q":"兩個近似鐘形資料集A和B的全距分別為36和54。使用s≈全距/6估計標準差，並判斷哪個資料集更分散。","o":[],"a":"A：s≈36/6=6；B：s≈54/6=9。B更分散。"},{"q":"两个近似钟形数据集A和B的极差分别为36和54。使用s≈极差/6估计标准差，并判断哪个数据集更分散。","o":[],"a":"A：s≈36/6=6；B：s≈54/6=9。B更分散。"}],"2:19":[{"q":"求資料3、4、5、3、4、1、6、9、6的全距與四分位距。","o":[],"a":"排序：1、3、3、4、4、5、6、6、9。全距=9−1=8；Q1位置=0.25(9+1)=2.5，Q1=(3+3)/2=3；Q3位置=0.75(9+1)=7.5，Q3=(6+6)/2=6；四分位距=6−3=3。"},{"q":"求数据3、4、5、3、4、1、6、9、6的极差与四分位距。","o":[],"a":"排序：1、3、3、4、4、5、6、6、9。极差=9−1=8；Q1位置=0.25(9+1)=2.5，Q1=(3+3)/2=3；Q3位置=0.75(9+1)=7.5，Q3=(6+6)/2=6；四分位距=6−3=3。"}],"2:20":[{"q":"ABC公司員工每兩周向利潤分享計劃繳款的算術平均數為52美元，標準差為8.5美元。至少多少百分比的繳款位於平均數上下各3.5個標準差之間？","o":["75%","87.76%","91.84%","95%"],"a":"91.84%\n切比雪夫定理：至少1−1/3.5²≈0.9184，即91.84%。"},{"q":"ABC公司员工每两周向利润分享计划缴款的算术均值为5 }

function renderLeaderboardData(){const visits=document.getElementById('visitTotal'),body=document.getElementById('leaderboardBody');if(!visits||!body)return;const data=window.firebaseStatsData||{};visits.textContent=Number.isFinite(data.visits)?data.visits:'—';if(data.error){body.innerHTML=`<div class="leaderboard-empty">${tr('Leaderboard is temporarily unavailable.','排行榜暫時無法載入。','排行榜暂时无法载入。')}</div>`;return}if(!data.ready){body.innerHTML=`<div class="leaderboard-empty">${tr('Connecting…','正在連線…','正在连接…')}</div>`;return}const scores=(data.scores||[]).slice().sort((a,b)=>leaderboardRating(b)-leaderboardRating(a)||(b.score/b.total)-(a.score/a.total)||b.total-a.total||a.durationMs-b.durationMs||String(a.nickname).localeCompare(String(b.nickname))).slice(0,50);if(!scores.length){body.innerHTML=`<div class="leaderboard-empty">${tr('No scores yet. Complete a random quiz to be first!','暫時未有成績。完成隨機組題，成為第一名吧！','暂时没有成绩。完成随机组题，成为第一名吧！')}</div>`;return}body.innerHTML=scores.map((s,i)=>`<div class="leaderboard-row${s.id===window.currentLeaderboardEntryId?' current-entry':''}" data-score-id="${esc(s.id||'')}"><span class="rank">${['🥇','🥈','🥉'][i]||i+1}</span><span class="name">${esc(s.nickname)}</span><span class="score">${s.score}/${s.total}</span><span class="time">${leaderboardTime(s.durationMs)}</span></div>`).join('');const current=body.querySelector('.current-entry');if(current)setTimeout(()=>current.scrollIntoView({behavior:'smooth',block:'center'}),120)}
function leaderboard(){transition++;busy=false;queue=[];mode='leaderboard';save();M.innerHTML=`<section class="leaderboard-page"><div class="leaderboard-intro"><div class="leaderboard-mascot" role="img" aria-label="Iris"><img src="assets/iris-happy-transparent.png" alt="Iris"></div><div class="bubble-stack"><div class="visitor-bubble">${tr('Already ','已有','已有')}<strong id="visitTotal">—</strong>${tr(' people have joined the challenge. Give it a try!','人加入挑戰，快來試試吧！','人加入挑战，快来试试吧！')}</div><div class="visitor-bubble quiz-hint-bubble"><span class="random-quiz-icon" aria-hidden="true">${ico('shuffle')}</span>${tr('Complete one random quiz to join the leaderboard.','完成一次random quiz就可以加入排行榜。','完成一次random quiz就可以加入排行榜。')}</div></div></div><div class="leaderboard-card"><div class="leaderboard-head"><span>${tr('Rank','名次','名次')}</span><span>${tr('Nickname','暱稱','昵称')}</span><span style="text-align:right">${tr('Score','答對','答对')}</span><span style="text-align:right">${tr('Time','用時','用时')}</span></div><div id="leaderboardBody"><div class="leaderboard-empty">${tr('Connecting…','正在連線…','正在连接…')}</div></div></div></section>${nav('trophy')}`;renderLeaderboardData();window.scrollTo(0,0)}
startRandom=function(){document.querySelectorAll('.celebration').forEach(e=>e.remove());transition++;mode='random';randomStartedAt=Date.now();randomElapsed=0;let all=bank.flatMap((unit,i)=>unit.map((_,j)=>[i,j])).filter(([i,j])=>!removedQuestionKeys.has(i+':'+j));for(let i=all.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}queue=all.slice(0,randomCount);begin()};
randomComplete=function(){mode='randomResult';randomElapsed=randomElapsed||Math.max(1000,Date.now()-randomStartedAt);let savedNick='';try{savedNick=localStorage.getItem('statsAdventureNickname')||''}catch(e){}M.innerHTML=`<section class="lesson-result random-result-page"><button class="random-result-close" onclick="randomMenu()" aria-label="${tr('Close','關閉','关闭')}">×</button><div class="finish-iris">${irisFace('complete')}</div><h1>${tr('Quiz complete!','練習完成！','练习完成！')}</h1><div class="result-score">${randomScore[0]}/${randomScore[1]}</div><div class="score-submit"><label for="leaderNickname">${tr('Add this score to the leaderboard','把這次成績加入排行榜','把这次成绩加入排行榜')}</label><div class="score-submit-row"><input id="leaderNickname" maxlength="20" autocomplete="nickname" value="${esc(savedNick)}" placeholder="${tr('Nickname','暱稱','昵称')}"><button class="green" id="scoreSubmitButton" onclick="submitLeaderboardScore()">${tr('Submit','提交','提交')}</button></div><div id="scoreSubmitStatus" class="score-submit-status"></div></div></section>`;window.scrollTo(0,0)};
async function submitLeaderboardScore(){const input=document.getElementById('leaderNickname'),button=document.getElementById('scoreSubmitButton'),status=document.getElementById('scoreSubmitStatus'),nickname=(input?.value||'').trim();if(!status||!button)return;status.classList.remove('error');if(!nickname){status.textContent=tr('Please enter a nickname.','請輸入暱稱。','请输入昵称。');status.classList.add('error');input?.focus();return}if(!window.statsFirebase){status.textContent=tr('Still connecting. Please try again in a moment.','仍在連線，請稍後再試。','仍在连接，请稍后再试。');status.classList.add('error');return}button.disabled=true;status.textContent=tr('Submitting…','正在提交…','正在提交…');try{const entryId=await window.statsFirebase.submitScore(nickname,randomScore[0],randomScore[1],randomElapsed);try{localStorage.setItem('statsAdventureNickname',nickname)}catch(e){}window.currentLeaderboardEntryId=entryId;leaderboard()}catch(e){status.textContent=tr('Could not submit. Please try again.','提交失敗，請再試一次。','提交失败，请再试一次。');status.classList.add('error');button.disabled=false}}
window.addEventListener('firebase-stats-updated',()=>{if(mode==='leaderboard')renderLeaderboardData()});

function migrateLessons(){if(state.lessonLayout===21)return;const previous=state.subDone||{},next={};lessonMigration.forEach((unit,i)=>unit.forEach((group,j)=>{if(group.every(([k])=>hasOwn(previous,i+':'+k))){const total=group.reduce((s,[k,n])=>s+n,0);next[i+':'+j]=Math.round(group.reduce((s,[k,n])=>s+Number(previous[i+':'+k])*n,0)/total)}}));state.previousLessonResults=previous;state.subDone=next;state.lessonLayout=21;}
let profiles=Object.create(null);try{Object.assign(profiles,JSON.parse(localStorage.getItem('statsAdventureV21Profiles')||localStorage.getItem('statsAdventureProfiles')||'{}'))}catch(e){}
let active;try{active=localStorage.getItem('statsAdventureV21Active')||localStorage.getItem('statsAdventureActive')}catch(e){}if(active&&profiles[active]){state=profiles[active];L=state.lang||0;document.getElementById('lang').value=L;migrateLessons();home()}else{try{Object.assign(state,JSON.parse(localStorage.getItem('statsAdventureV21Guest')||localStorage.getItem('statsAdventureGuest')||'{}'))}catch(e){}L=state.lang||0;document.getElementById('lang').value=L;migrateLessons();home()}</script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCVRkmJITmjlhjfgevcLBY8Q09dchDvc6A',authDomain:'statistics-adventure.firebaseapp.com',projectId:'statistics-adventure',storageBucket:'statistics-adventure.firebasestorage.app',messagingSenderId:'606004633040',appId:'1:606004633040:web:0fd5343a2549eb173d6dd5'};
const stats=window.firebaseStatsData={ready:false,visits:null,scores:[],error:null};
const announce=()=>window.dispatchEvent(new CustomEvent('firebase-stats-updated'));
try{
 const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
 let visitorsReady=false,scoresReady=false;
 const markReady=()=>{stats.ready=visitorsReady&&scoresReady;stats.error=null;announce()};
 onSnapshot(collection(db,'visitors'),snap=>{stats.visits=snap.size;visitorsReady=true;markReady()},()=>{stats.error=true;announce()});
 onSnapshot(collection(db,'scores'),snap=>{stats.scores=snap.docs.map(d=>({id:d.id,...d.data()}));scoresReady=true;markReady()},()=>{stats.error=true;announce()});
 const credential=await signInAnonymously(auth),uid=credential.user.uid,visitorRef=doc(db,'visitors',uid),visitor=await getDoc(visitorRef);
 if(!visitor.exists())await setDoc(visitorRef,{createdAt:serverTimestamp()});
 window.statsFirebase={async submitScore(nickname,score,total,durationMs){nickname=String(nickname).trim().slice(0,20);score=Math.round(Number(score));total=Math.round(Number(total));durationMs=Math.max(1000,Math.round(Number(durationMs)));if(!nickname||!Number.isInteger(score)||!Number.isInteger(total)||score<0||score>total||total<5||total>30)throw new Error('invalid');const ref=await addDoc(collection(db,'scores'),{nickname,score,total,durationMs,submittedBy:uid,updatedAt:serverTimestamp()});return ref.id}};
}catch(e){stats.error=true;announce();console.warn('Firebase statistics unavailable',e)}
</script>
