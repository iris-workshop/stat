</div></main><script>const hasOwn=(obj,key)=>Object.prototype.hasOwnProperty.call(obj||{},key);const bank=[[{"q":"What is a population?","a":"All the people or cases that the researcher wants to study\nA population is the whole group of interest. For example, in a study of university students' study habits, the population is all university students defined by the study.","o":["A small group chosen for a study","All the people or cases that the researcher wants to study","One variable in a data set","A chart used to summarize data"]},{"q":"What is a sample?","a":"A selected part of the population\nA sample is part of the population. For example, selecting 100 university students from that population gives a sample of 100.","o":["A selected part of the population","Every possible person or case in the study","A relationship between two variables","A complete copy of the population"]},{"q":"A survey asked 800 university students about social media use. Of these students, 60% said they used social media for more than 6 hours each day.","a":"Descriptive\nDescriptive = describe the 800 respondents; inferential = use them to estimate all students. This statement stops at the sample.","o":["Descriptive","Inferential"]},{"q":"Using the results from the 800 students, the researcher estimates that about 60% of all university students in Hong Kong use social media for more than 6 hours each day.","a":"Inferential\nInferential statistics use a sample to draw conclusions about a population. E.g. survey 800 students to estimate the proportion among all Hong Kong university students.","o":["Descriptive","Inferential"]},{"q":"Find the average age of the students in one class.","a":"Univariate\nCount the variables, not the students: age alone = univariate; age + GPA = bivariate.","o":["Univariate","Bivariate","Multivariate"]},{"q":"Study the relationship between student age and GPA.","a":"Bivariate\nAge + GPA = two variables (bivariate); adding gender makes three (multivariate).","o":["Univariate","Bivariate","Multivariate"]},{"q":"Study the relationship between age and GPA, and check whether the relationship is different for men and women.","a":"Multivariate\nAge, GPA and gender = three variables. One is univariate, two bivariate, three or more multivariate.","o":["Univariate","Bivariate","Multivariate"]},{"q":"Eye colour?","a":"Qualitative\nQualitative = category labels (brown, blue); quantitative = measurable numbers (height, age).","o":["Qualitative","Quantitative"]},{"q":"Age in years?","a":"Quantitative\nAge measures an amount: 20 and 22 differ by 2 years. Birthplace, by contrast, is a category label.","o":["Qualitative","Quantitative"]},{"q":"Country of birth?","a":"Qualitative\nThe United States and Germany are category labels, not quantities. Coding them 1 and 2 does not make them quantitative.","o":["Qualitative","Quantitative"]},{"q":"Savings account balance?","a":"Quantitative\nA balance of $200 is $100 more than $100; these numbers measure amounts, unlike account-type labels.","o":["Qualitative","Quantitative"]},{"q":"Number of children in a family?","a":"Discrete\nDiscrete = count (0, 1, 2 children, never 1.5); continuous = measure (e.g. 1.52 m in height).","o":["Discrete","Continuous"]},{"q":"Height?","a":"Continuous\nHeight can be 160, 160.5 or 160.52 cm (continuous); number of cars can only be counted in whole units (discrete).","o":["Discrete","Continuous"]},{"q":"Number of cars owned?","a":"Discrete\nCars are counted as 0, 1, 2, not 1.5; height can take fractional values. Count = discrete, measure = continuous in these examples.","o":["Discrete","Continuous"]},{"q":"Gender?","a":"Nominal\nNominal categories have no natural order. E.g. gender or blood type (A, B, AB, O); none ranks above another.","o":["Nominal","Ordinal","Interval-ratio"]},{"q":"Teacher ratings (Superior, Good, Average, Poor, Inferior)?","a":"Ordinal\nNominal: no rank (blood type). Ordinal: ranked (Good > Average > Poor), but the gaps need not be equal.","o":["Nominal","Ordinal","Interval-ratio"]},{"q":"Age in years?","a":"Interval-ratio\nEqual gaps: 20→21 and 30→31 are both one year. Age also has a meaningful zero; unlike ratings, ratios of ages are meaningful.","o":["Nominal","Ordinal","Interval-ratio"]},{"q":"A survey records a student's programme as 1 = Psychology, 2 = Politics, and 3 = Social Studies.\na. Is the variable qualitative or quantitative?\nb. What is its level of measurement? _\nc. Can we say that code 3 is greater than code 1? Explain briefly.","a":"Qualitative; Nominal; No\nNominal scales have no natural order. Programme codes 1, 2 and 3 are labels, not numerical amounts.","o":["Qualitative; Nominal; No","Quantitative; Ordinal; Yes","Qualitative; Ordinal; Yes"]},{"q":"Students rate a teacher as Superior, Good, Average, Poor, or Inferior.\na. What is the level of measurement? ","a":"Ordinal\nGood ranks higher than Poor, but we cannot measure the gap in units. Nominal categories (e.g. blood type) have no rank.","o":["Nominal","Ordinal","Interval-ratio"]},{"q":"Students rate a teacher as Superior, Good, Average, Poor, or Inferior.\nb. Can the ratings be placed in order? ","a":"Yes\nSuperior > Good > Average > Poor > Inferior. Ordinal means order is meaningful, not that gaps are equal.","o":["Yes","No"]},{"q":"Students rate a teacher as Superior, Good, Average, Poor, or Inferior.\nc. Can we measure exactly how much better Good is than Poor?","a":"No\nGood ranks above Poor, but we cannot say it is twice as good or that the gap equals the gap between two other ratings.","o":["Yes","No"]},{"q":"A percentage or proportion compares:","a":"one part with the whole\nA proportion is part ÷ total; percentage = proportion × 100. E.g. 20 out of 50 students → 20/50 = 0.4 = 40%.","o":["one part with the whole","one part with another part","two time periods","the actual number of events with possible events"]},{"q":"Which formula gives a percentage?","a":"(f / N) × 100\nA proportion is part ÷ total; percentage = proportion × 100. E.g. 20 out of 50 students → 20/50 = 0.4 = 40%.","o":["(f / N) × 100","(N / f) × 100","f / N","(f2 - f1) / f1"]},{"q":"In a class of 50 students, 20 study Psychology. Find the proportion and percentage studying Psychology.\na. Proportion = __________","a":"20 / 50 = 0.40","o":[]},{"q":"In a class of 50 students, 20 study Psychology. Find the proportion and percentage studying Psychology.\nb. Percentage % = __________","a":"20 ÷ 50 × 100 = 40%","o":[]},{"q":"A study has only 15 people. According to the lecture guideline, what should the researcher report?","a":"The actual frequencies\nFor 15 people, one person already represents 6.67%. Reporting 1 out of 15 makes the small sample clearer; percentages are not mathematically forbidden.","o":["Only a percentage","The actual frequencies","Only a proportion","No result"]},{"q":"Can percentages be used for nominal and ordinal variables?","a":"Yes, at all levels of measurement\nPercentages count category membership, not category values: e.g. 12 of 30 students choose bus = 40%, even though transport type is nominal.","o":["Yes, at all levels of measurement","No, only for interval-ratio variables","Only when N is below 20","Only when the answer is 50%"]},{"q":"A ratio compares:","a":"one part with another part\nA ratio compares two quantities, e.g. 20 girls to 10 boys = 20 ÷ 10 = 2:1 (not 20 ÷ 30).","o":["a part with the whole","one part with another part","a sample with a population","an earlier value with a later value"]},{"q":"Which formula gives the ratio of category 1 to category 2?","a":"f1 / f2\nA ratio compares two quantities, e.g. 20 girls to 10 boys = 20 ÷ 10 = 2:1 (not 20 ÷ 30).","o":["f1 / f2","f2 / f1","f1 / N","(f2 - f1) / f1"]},{"q":"A class has 23 women and 19 men. Find the ratio of men to women.  Answer: __________ the ratio of women to men.  Answer: __________","a":"Men : women = 19 / 23 = 0.83; women : men = 23 / 19 = 1.21","o":[]},{"q":"A rate compares:","a":"actual events with possible events during a period of time\nA rate counts events occurring over a stated period relative to the population at risk, often with a multiplier. For example, 10 births per 1,000 residents in one year. Milk as a share of a cup is a proportion or percentage, not a rate, because it is not a count of events over time.","o":["one category with another category","actual events with possible events during a period of time","a sample percentage with a population percentage","an earlier value with a later value"]},{"q":"A town of 2,300 people had 17 births last year. Find the birth rate per 1,000 residents.  Answer: __________","a":"(17 / 2,300) x 1,000 = 7.39 per 1,000","o":[]},{"q":"What does percentage change measure?","a":"The relative increase or decrease over time\nFrom 10 to 15: change = 5, percentage change = 5 ÷ 10 × 100 = 50%. Divide by the original value, not the new value.","o":["The relative increase or decrease over time","The size of one category compared with another","The percentage of a sample in one category","The number of events per 1,000 people"]},{"q":"Which formula gives percentage change from time 1 to time 2?","a":"(f2- f1) / f1× 100\nPercentage change compares the change with its original value: (new − old) ÷ old × 100.","o":["(f2- f1) / f1× 100","(f1- f2) / f2 × 100","(f1- f2) / f1 × 100","(f2- f1) / f2× 100"]},{"q":"A murder rate increased from 7 to 10. Find the percentage change.  Answer: __________Increase or decrease? __________","a":"((10 - 7) / 7) x 100 = 42.86     Increase","o":[]},{"q":"What does a frequency distribution show?","a":"The number of cases in each category\nFrequency counts how often a category or value occurs. E.g. scores 1, 1, 2, 3 → 1: 2 times; 2: 1 time; 3: 1 time.","o":["The number of cases in each category","The relationship between two variables","The change between two years","The difference between a sample and a population"]},{"q":"What does mutually exclusive mean?","a":"Each case fits into one category only\nMutually exclusive means no overlap. E.g. integer age groups 18–20 and 21–23: age 20 belongs only to the first group.","o":["Each case fits into one category only","Each case fits into two categories","Some cases do not need a category","Every category has the same frequency"]},{"q":"What does exhaustive mean?","a":"Every case can fit into a category\nExhaustive means every case is covered. E.g. employed, unemployed and not in the labour force cover all labour-force statuses.","o":["Every case can fit into a category","Every category has the same size","Each case is counted twice","All categories must be numbers"]},{"q":"In a good frequency distribution, the categories should be:","a":"mutually exclusive and exhaustive\nNo overlap and no missing cases. For continuous age, use left-closed, right-open intervals such as [18,20), [20,22), [22,24); each value belongs to exactly one class.","o":["overlapping and incomplete","mutually exclusive and exhaustive","equal in frequency","continuous only"]},{"q":"What is wrong with these age groups: 10-20, 20-30, and 30-40? (Both endpoints are included.)","a":"They overlap\nMutually exclusive categories cannot overlap. Ages 20 and 30 each belong to two intervals here.","o":["They overlap","They are too small","They have equal widths","They are nominal"]},{"q":"A survey uses these employment categories: full-time and part-time. But some people are unemployed. Which rule is broken?","a":"Exhaustive\nExhaustive categories cover all cases. Unemployed people are left out here.","o":["Mutually exclusive","Exhaustive","Equal intervals","Cumulative frequency"]},{"q":"Which interval is open-ended?","a":"40 and above\nOpen-ended: 40 and above (no upper limit). Closed interval: 40–49 (both limits specified).","o":["20-29","30-39","40 and above","50-59"]},{"q":"Which distribution lists every individual score?","a":"Ungrouped\nUngrouped: each distinct value is listed separately, e.g. 1, 2, 3, 4, …\nGrouped: values are combined into intervals, e.g. 1–10, 11–20, 21–30. Each row shows its frequency.","o":["Grouped","Ungrouped","Cumulative","Nominal only"]},{"q":"Why might a researcher group ages into class intervals?","a":"There are many different age values\nGrouping makes many values easier to read. E.g. ages 18, 19, 20, 21, … can be summarized in groups 18–22, 23–27, etc.","o":["There are many different age values","Age is nominal","All people have the same age","Age cannot be measured"]},{"q":"Find the midpoint of the class interval 10-19.  Answer: __________","a":"(10 + 19) / 2 = 14.5","o":[]},{"q":"Age intervals and frequencies:\n18–22: 8   |   23–27: 12\n28–32: 6   |   33–37: 4\nWhich is the cumulative frequency column?","a":"8, 20, 26, 30\nCumulative frequency is a running total: 8, 8+12=20, 20+6=26, 26+4=30.","o":["8, 12, 6, 4","8, 20, 26, 30","8, 20, 18, 10","4, 10, 22, 30"]},{"q":"Using the table, which is the cumulative percentage column?","a":"26.67%, 66.67%, 86.67%, 100%\nCumulative percentage = cumulative frequency ÷ total × 100%. For example, 20 ÷ 30 × 100% ≈ 66.67%.","o":["26.67%, 40%, 20%, 13.33%","8%, 20%, 26%, 30%","26.67%, 66.67%, 86.67%, 100%","25%, 50%, 75%, 100%"]},{"q":"Using the table, how many students are aged 27 or below?","a":"20\nAged 27 or below includes the first two groups: 8 + 12 = 20 students.","o":["12","20","26","30"]},{"q":"Age intervals and frequencies:\n18–22: 8   |   23–27: 12\n28–32: 6   |   33–37: 4\nWhat percentage of students are aged 32 or below?","a":"86.67%\nThe first three groups contain 8+12+6=26 students out of 30. Percentage = 26 ÷ 30 × 100% ≈ 86.67%.","o":["20%","66.67%","86.67%","100%"]},{"q":"Which graph is useful for a discrete variable with only a few categories?","a":"Pie chart\nPie chart: parts of a whole (e.g. bus 40%, MTR 60%). Bar chart: compare categories, with gaps. Histogram: numerical intervals, no gaps between adjacent nonempty bins.","o":["Pie chart","Histogram","Frequency polygon only","Scatterplot"]},{"q":"Which graph is usually best for a continuous interval-ratio variable?","a":"Histogram\nHistogram: continuous numerical data (e.g. height); adjacent bins touch — no gap. Bar chart: categories or discrete counts (e.g. programmes); bars have gaps. Pie chart: parts of a whole (percentages).","o":["Pie chart","Histogram","Bar chart only","Table without a graph"]},{"q":"What is the clearest visual difference between a bar chart and a histogram?","a":"Bar-chart bars have gaps, while histogram bars touch\nBar chart: separate categories (bus, MTR) → gaps. Histogram: adjacent numerical intervals ([0,10), [10,20)) → touching bars. Empty bins can appear as gaps.","o":["Bar-chart bars have gaps, while histogram bars touch","Histogram bars have gaps, while bar-chart bars touch","Only bar charts use numbers","Only histograms have a title"]},{"q":"Where are the dots placed when drawing a frequency polygon?","a":"At each class midpoint\nFor interval 10–20 with frequency 8, plot (15, 8): x = midpoint, y = frequency. Join the dots with lines, not bars.","o":["At each class midpoint","At the lower limit only","Inside a pie chart","At random positions"]},{"q":"The line chart shows marriage rates per 1,000 residents from 2022 to 2026. Between which two years did the rate fall?","a":"2023 to 2024\nA decline occurs when the later value is smaller: the rate fell from 7 to 5.","o":["2022 to 2023","2023 to 2024","2024 to 2025","2025 to 2026"]},{"q":"Based on the line chart, describe the overall pattern.","a":"Overall increase, with a fall in 2024\nCompare the first and last values for the overall trend (6 to 10); the drop to 5 is a temporary decline.","o":["Continuous decrease","Continuous increase without any fall","Overall increase, with a fall in 2024","No overall change"]},{"q":"Inferential statistics are usually based on","a":"Samples\nInferential statistics use a sample to draw conclusions about a population. E.g. survey 800 students to estimate the proportion among all Hong Kong university students.","o":["Populations","Samples","Individuals","Groups"]},{"q":"“Ninety percent of dorm residents approved a proposed ban on smoking”. This statement is an example of the use of","a":"univariate descriptive statistics.\nUnivariate: one variable (approval). Descriptive: summarize residents' observed responses. Predicting all residents from a sample would be inferential.","o":["inferential statistics.","univariate descriptive statistics.","bivariate descriptive statistics","multivariate descriptive statistics."]},{"q":"Which of the following is a discrete variable?","a":"Number of cars\nDiscrete variables take separate, countable values, such as 0, 1 or 2, rather than fractions.","o":["Height","Age","Miles per gallon","Number of cars"]},{"q":"Which of the following is a continuous variable?","a":"Time spent doing assignment\nTime can be 20, 20.5 or 20.52 minutes (continuous); number of assignments is a whole-number count (discrete).","o":["Number of children","Time spent doing assignment","Number of courses you are taking in this semester","Number of meals you consumed yesterday"]},{"q":"Choose the nominal level variable below:","a":"eye color of students in statistics class\nNominal scales classify observations into unordered categories; eye colours have no natural ranking.","o":["size of family unit","eye color of students in statistics class","speed of travel of a jet","your weight"]},{"q":"The variable socioeconomic status ranges from upper class to lower class and is an example of the","a":"ordinal level of measurement.\nOrdinal scales rank categories without requiring equal gaps; social classes can be ordered but distances are not measurable.","o":["nominal level of measurement.","ordinal level of measurement.","interval level of measurement.","ratio level of measurement."]},{"q":"Forty of four hundred students attend all of their classes. What percentage of the student body is this?","a":"10%\nPercentage = part ÷ total × 100 = 40 ÷ 400 × 100 = 10%.","o":["10%","40%","4%","400%"]},{"q":"To be converted to a percentage, the proportion must be multiplied by","a":"100\nA proportion is expressed per 1; multiplying by 100 expresses it per 100.","o":["10","100","1000","Any of the above"]},{"q":"The crude birth rate of a city that has 200 births in a year and a population of 7000 would be found by using which of the following?","a":"(200/7000) × 1000\nCrude birth rate = annual births ÷ population × 1,000.","o":["(200/7000) × 1000","7000/200","(1000/200) × 7000","(200/1000) × 7000"]},{"q":"Assume ages are whole numbers from 18 to 23. The class intervals below represent ages of respondents. Which set of intervals is both exhaustive and mutually exclusive?","a":"18-19, 20-21, 22-23\nMutually exclusive means no overlap; exhaustive means full coverage. Each integer age 18–23 appears exactly once. This is simplified notation for whole-number ages. For a mathematically precise continuous-age grouping, write [18,20), [20,22), [22,24).","o":["18-19, 19-20, 20-21","18-19, 20-21, 22-23","18-20, 22-24, 26-28","18-19, 21-22, 24-25"]}],[{"q":"Central tendency mainly describes how far the observations are from one another.","a":"False\nCentral tendency = typical value; dispersion = spread. E.g. 4, 5, 6 and 1, 5, 9 both average 5, but the second is more spread out.","o":["True","False"]},{"q":"Which of the following is not a measure of central tendency introduced in this lecture?","a":"Range\nMean, median and mode describe the centre. Range describes spread: for 2, 4, 6, mean = 4 but range = 6−2 = 4.","o":["Mean","Median","Mode","Range"]},{"q":"Which measure of central tendency is most appropriate for a nominal variable?","a":"Mode\nMode = the most frequent value or category. E.g. blue, brown, brown → brown is the mode. No numerical order is needed.","o":["Mean","Median","Quartile","Mode"]},{"q":"Which symbol is commonly used for the population mean?","a":"μ\nPopulation parameters often use Greek letters: population mean = μ and population standard deviation = σ. Population size uses capital N. By contrast, common sample symbols are x̄ for the sample mean, s for the sample standard deviation, and lowercase n for sample size.","o":["μ","x̄","n","P"]},{"q":"Which symbol is commonly used for the sample mean?","a":"x̄\nx̄ is calculated from the sample (e.g. 50 students); μ describes the population (e.g. all 1,000).","o":["N","x̄","μ","D1"]},{"q":"A school has 1,000 students. The average height of all 1,000 students is 165 cm, while the average height of 50 randomly selected students is 163 cm.  is a parameter, and  is a statistic.","a":"165 cm parameter; 163 cm statistic\nA parameter describes a population; a statistic describes a sample. The 50 students are a subset of the 1,000.","o":["165 cm parameter; 163 cm statistic","163 cm parameter; 165 cm statistic","Both parameters","Both statistics"]},{"q":"Which is the correct formula for the sample mean?","a":"x̄ = ΣX ÷ n\nMean = sum ÷ count. E.g. (2 + 4 + 6) ÷ 3 = 4.","o":["μ = ΣX ÷ n","x̄ = N ÷ ΣX","x̄ = ΣX ÷ n","x̄ = Σn ÷ X"]},{"q":"The robbery rates for eight cities have a total of 4,121.6. Calculate the mean robbery rate.","a":"Answer: 4,121.6 ÷ 8 = 515.2","o":[]},{"q":"The data are 2, 4, and 6. The mean is 4.\n(a) Calculate the sum of deviations from the mean:\nAnswer: ____________________\n(b) Calculate the sum of squared deviations from the mean:\nAnswer: ____________________","a":"Answer: (a) (2 − 4) + (4 − 4) + (6 − 4) = 0; (b) (2 − 4)² + (4 − 4)² + (6 − 4)² = 8","o":[]},{"q":"For any dataset, what is the sum of the deviations of all observations from the mean?","a":"0\nDeviations from the mean cancel. E.g. 2, 4, 6 have mean 4; deviations −2, 0, +2 sum to 0.","o":["0","1","The sample size n","It cannot be determined"]},{"q":"After one extremely large value is added to a dataset, which measure usually changes the most?","a":"Mean\nThe mean uses every value; the median uses the middle rank. E.g. 2, 3, 100 → mean 35, median 3. The extreme value pulls the mean upward.","o":["Mean","Median","Mode","Level of measurement"]},{"q":"Why can the mean usually not be calculated accurately when the highest class is open-ended, such as USD 200,000 or above?","a":"The exact values in the open-ended class are unknown\nFor a class '100 and above', values might be 101 or 1,000. Without the actual values/sum, its mean cannot be known; even a class midpoint is undefined.","o":["The class frequency must be zero","The mean cannot be used for an income variable","The exact values in the open-ended class are unknown","The data have not been sorted"]},{"q":"For the data 2, 4, and 6, the mean is 4. Calculate:\n(a) The sum of squared deviations from 4:\n(2 − 4)² + (4 − 4)² + (6 − 4)² = ______\n(b) The sum of squared deviations from 3:\n(2 − 3)² + (4 − 3)² + (6 − 3)² = ______","a":"Answer: 8,11, the mean 4 gives the smaller result.","o":[]},{"q":"A set of height measurements is approximately symmetric, contains no outliers, and will be used in further statistical analysis. Which measure should be preferred?","a":"Mean\nMean uses every height. Median uses the middle rank and is preferable with strong outliers; mode is most useful for frequent categories.","o":["Mean","Mode","Open-ended class interval","Minimum only"]},{"q":"Which is the correct formula for the weighted mean?","a":"x̄w = Σ(wX) ÷ Σw\nWeighted mean = sum of weighted values ÷ total weight. E.g. score 60 occurs twice and 90 once: (60 × 2 + 90 × 1) ÷ 3 = 70.","o":["x̄w = ΣX ÷ Σw","x̄w = Σ(wX) ÷ Σw","x̄w = Σw ÷ ΣX","x̄w = Σ(w + X) ÷ n"]},{"q":"In frequency data, what does the weight w usually represent?","a":"The frequency of the value\nWeighted mean = sum of weighted values ÷ total weight. E.g. score 60 occurs twice and 90 once: (60 × 2 + 90 × 1) ÷ 3 = 70.","o":["The rank of the value","The unit of measurement","The frequency of the value","The population mean"]},{"q":"A restaurant sells three drinks at USD 0.90 each, four at USD 1.25 each, and three at USD 1.50 each. Calculate the weighted average selling price.","a":"USD 1.22\nWeighted mean = total sales ÷ total drinks = (3×0.90 + 4×1.25 + 3×1.50) ÷ 10 = USD 1.22.","o":["USD 1.20","USD 1.22","USD 1.25","USD 1.50"]},{"q":"In a course, assignments count for 30%, quizzes for 30%, and the examination for 40%. A student scores 80, 70, and 90 in these components. Calculate the weighted overall mark.","a":"81\nMultiply each score by its weight, then add: 80×0.30 + 70×0.30 + 90×0.40 = 81.","o":["78","80","81","90"]},{"q":"What must be done before calculating the median?","a":"Order the data\nMedian = middle value after sorting. E.g. 9, 1, 5 → 1, 5, 9 → median = 5.","o":["Order the data","Calculate every deviation","Remove every extreme value","Multiply each value by a weight"]},{"q":"Find the median of 10, 10, 8, 7, 5, 4, 2, and 1.","a":"6\nAfter ordering the data, the two middle values are 5 and 7. Their average is (5 + 7) ÷ 2 = 6. Writing (7 + 5) ÷ 2 gives exactly the same result because addition can be reversed.","o":["5","6","7","7 and 5"]},{"q":"The median is usually less affected by extreme values than the mean.","a":"True\nThe mean uses every value; the median uses the middle rank. E.g. 2, 3, 100 → mean 35, median 3. The extreme value pulls the mean upward.","o":["True","False"]},{"q":"What is normally the minimum level of measurement required to calculate the median?","a":"Ordinal\nMedian needs an order. E.g. poor < average < good has a middle category; eye colours cannot be ranked naturally.","o":["Nominal","No level of measurement is required","Ordinal","Ratio only"]},{"q":"A median can be calculated for a nominal variable if the variable has enough categories.","a":"False\nMedian needs an order. E.g. poor < average < good has a middle category; eye colours cannot be ranked naturally.","o":["True","False"]},{"q":"When can the median still be identified in a frequency distribution with an open-ended class interval?","a":"The median does not fall in the open-ended class\nThe median depends on the middle position, so an open-ended class elsewhere need not prevent its identification.","o":["The open-ended class must have a frequency of zero","The sample size must be even","All classes must have the same frequency","The median does not fall in the open-ended class"]},{"q":"An income distribution is strongly right-skewed with a few extremely high incomes. Which measure of central tendency is more appropriate?","a":"Median\nThe mean uses every value; the median uses the middle rank. E.g. 2, 3, 100 → mean 35, median 3. The extreme value pulls the mean upward.","o":["Mean","Median"]},{"q":"Satisfaction is recorded as very dissatisfied, dissatisfied, neutral, satisfied, or very satisfied. Which measure should be preferred to report the central category?","a":"Median\nRatings can be ordered (dissatisfied → neutral → satisfied), but gaps are not measurable. Median uses order; mean requires meaningful numerical gaps.","o":["Range","Median","Variance","Mean only"]},{"q":"What does the Pth percentile represent?","a":"After sorting from smallest to largest, a value above approximately P% of the observations\nFirst arrange the data from smallest to largest. The Pth-percentile value is at a position above approximately P% of the observations. For example, a score at P80 is above about 80% of the scores; ties can affect the exact percentage.","o":["The mean of P observations","The highest P observations","After sorting from smallest to largest, a value above approximately P% of the observations","P% of the sum of the data"]},{"q":"Which percentile corresponds to the first quartile Q1?","a":"25th percentile\nQuartiles divide ordered data into four parts; Q1 marks the first 25%.","o":["25th percentile","50th percentile","75th percentile","100th percentile"]},{"q":"What is the second quartile Q2 equal to?","a":"Median\nQ2 is the 50th percentile, the middle position of ordered data.","o":["Mode","Median","Maximum","Mean"]},{"q":"Approximately what percentage of observations lie below the eighth decile D8?","a":"80%\nDeciles divide ordered data into ten parts; D8 marks the 80th percentile.","o":["8%","20%","50%","80%"]},{"q":"Which formula does this lecture use to find the location of a percentile?","a":"Lp = (n + 1)(P ÷ 100)\nFor n=19, P25 position=(19+1)×0.25=5. Read the fifth ordered value; the position 5 is not necessarily the score.","o":["Lp = (n + 1)(P ÷ 100)","Lp = n ÷ P","Lp = ΣX ÷ n","Lp = P − n"]},{"q":"The eighth value in an ordered set of commission amounts for 15 agents is 2,038. Use the lecture formula to find the median.","a":"Answer: L50 = (15 + 1)(50 ÷ 100) = 8; the 8th value is 2,038.","o":[]},{"q":"For 15 ordered commission values, the fourth value is 1,721. Which calculation correctly locates Q1?","a":"(15 + 1) × 0.25 = 4\nUse L25 = (n + 1) × 0.25. Therefore Q1 is at position 4; only then do we read the fourth value, 1,721. The main point is the position formula, not copying the value from the question.","o":["(15 + 1) × 0.25 = 4","15 × 0.25 = 3.75","(15 + 1) × 0.50 = 8","(15 − 1) × 0.25 = 3.5"]},{"q":"In the same ordered set of 15 commission amounts, the twelfth value is 2,205. Find Q3.","a":"Answer: L75 = (15 + 1)(75 ÷ 100) = 12; Q3 = 2,205.","o":[]},{"q":"For a sample of n = 19, use the lecture formula to find the location L50 of the 50th percentile.","a":"Answer: L50 = (19 + 1)(50 ÷ 100) = 10th position","o":[]},{"q":"For a sample of n = 19, use the lecture formula to find the position of Q1.","a":"Answer: L25 = (19 + 1)(25 ÷ 100) = 5th position","o":[]},{"q":"A person's score is at the 80th percentile. Which is the best interpretation?","a":"Approximately 80% of the scores are below this position\nAt P80, about 80% of scores are below and 20% above (allow for ties). It does not mean a score of 80 marks.","o":["The person answered 80% of the questions correctly","Approximately 80% of the scores are below this position","The person's score must be 80 marks","The person is in both the lowest 20% and the highest 80%"]},{"q":"Q1, Q2, and Q3 divide ordered data into four parts.","a":"True\nQ1, Q2 and Q3 correspond to the 25th, 50th and 75th percentiles.","o":["True","False"]},{"q":"What is the mode?","a":"The most frequently occurring value or category\nMode = the most frequent value or category. E.g. blue, brown, brown → brown is the mode. No numerical order is needed.","o":["The most frequently occurring value or category","The middle value after the data have been ordered","The average of all values","The average of the maximum and minimum values"]},{"q":"What usually represents the mode in a bar chart?","a":"The tallest bar\nIf bus has frequency 12 and MTR 20, the MTR bar is taller and MTR is the mode. Mode counts occurrences, not numerical size.","o":["The leftmost bar","The rightmost bar","The tallest bar","The mean height of all bars"]},{"q":"Which dataset has no clear single mode?","a":"1, 2, 3, 4\nAll four values occur once, so none has a uniquely highest frequency.","o":["1, 1, 2, 3","1, 2, 3, 4","2, 2, 2, 3","4, 4, 5, 6"]},{"q":"When does a dataset have more than one mode?","a":"Several values share the highest frequency\nMultiple modes occur when values tie for the highest frequency. E.g. 1, 1, 2, 2, 3 → two modes: 1 and 2.","o":["Several values share the highest frequency","The data have been ordered","The sample size is odd","The mean equals the median"]},{"q":"The mode will usually not change when a single extremely large observation is added.","a":"True\n2, 2, 3 has mode 2. Add 100 and mode stays 2, although the mean rises. Mode depends on counts, not magnitude.","o":["True","False"]},{"q":"A survey asks residents to choose their favourite form of transport from bus, MTR, private car, and walking. Which measure of central tendency should be reported?","a":"Mode\nMode = the most frequent value or category. E.g. blue, brown, brown → brown is the mode. No numerical order is needed.","o":["Mean","Median","Mode","75th percentile"]},{"q":"Which distribution is right-skewed?","a":"A distribution with a longer right tail\nPositive skew means a longer right tail. E.g. incomes 10, 11, 12, 13, 100: a few high incomes stretch the right tail.","o":["A distribution with a longer right tail","A distribution with a longer left tail"]},{"q":"What is the typical relationship among the three measures of central tendency in a negatively skewed or left-skewed distribution?","a":"Mode > median > mean\nLeft tail pulls the mean left: mean < median < mode in a typical unimodal left-skewed distribution. Right skew usually reverses this order.","o":["Mean > median > mode","Mean > mode > median","Mode > median > mean","The three measures must be equal"]},{"q":"In which direction do a few extremely high observations usually pull the mean?","a":"To the right or toward larger values\nFor 2, 3, 4 the mean is 3. Replace 4 with 100: mean rises to 35, median stays 3. High extremes pull the mean right.","o":["To the left or toward smaller values","To the right or toward larger values","It does not change","It must become equal to the mode"]},{"q":"In a typical positively skewed distribution, the mean is greater than the median.","a":"True\nIn a typical right-skewed distribution, high extreme values pull the mean above the median; this is not a universal rule.","o":["True","False"]},{"q":"A distribution has a mode of 60, a median of 50, and a mean of 40. Which type of distribution is most likely?","a":"Negatively skewed\nThe mean below the median and mode suggests a long left tail in a typical unimodal distribution.","o":["Positively skewed","Negatively skewed","Symmetric","Uniform"]},{"q":"Why is the median usually more reliable than the mean as a typical value in a highly skewed distribution?","a":"Less affected by extreme values\nThe mean uses every value; the median uses the middle rank. E.g. 2, 3, 100 → mean 35, median 3. The extreme value pulls the mean upward.","o":["Less affected by extreme values","Always equals the mean","Uses every value in its calculation"]},{"q":"House prices in a district are strongly right-skewed and include a small number of extremely expensive properties. Which measure best describes a typical house price?","a":"Median\nThe mean uses every value; the median uses the middle rank. E.g. 2, 3, 100 → mean 35, median 3. The extreme value pulls the mean upward.","o":["Maximum","Mean","Weighted total","Median"]},{"q":"Which measure of central tendency is most appropriate for the eye colours of movie stars?","a":"Mode\nMode = the most frequent value or category. E.g. blue, brown, brown → brown is the mode. No numerical order is needed.","o":["Mean","Mode","Median","Midrange"]},{"q":"In a set of five scores, if only the highest score increases, which measure must change?","a":"Mean\nThe mean equals sum ÷ count. Increasing the largest score raises the sum while the count stays fixed.","o":["Mean","Median","Mode","None"]},{"q":"The grades on a final exam for a statistics class are as follows: 25% As, 35% Bs, 30% Cs, 9% Ds and 1% Fs. The modal grade of the class is","a":"B\nThe mode is the most frequent category. Grade B has the largest share (35%).","o":["A","B","C","D"]},{"q":"It is possible for a variable to have:","a":"All of the above\nThe number of modes depends on frequencies: several values can share the highest frequency, or no value may stand out.","o":["One mode","Many modes","No mode","All of the above"]},{"q":"In a ranked list of 15 scores, which case gives the median?","a":"8th\nFor an odd number of observations, the median position is (n + 1) ÷ 2 = 8.","o":["7th","8th","9th","15th"]},{"q":"Why cannot the median be found for a nominal variable?","a":"The categories cannot be ranked\nMedian needs an order. E.g. poor < average < good has a middle category; eye colours cannot be ranked naturally.","o":["The frequencies are unknown","The categories cannot be ranked","The sample is too small","The mean is zero"]},{"q":"A student scores at the 85th percentile. Which statement is correct?","a":"Both of the first two statements\nThe 85th percentile places about 85% of observations below and 15% above, ignoring ties.","o":["About 85% of students scored lower","About 15% of students scored higher","Neither of the first two statements","Both of the first two statements"]},{"q":"The third decile is equivalent to which percentile?","a":"30th\nEach decile represents ten percentile points, so D3 = P30.","o":["3rd","10th","30th","75th"]},{"q":"A distribution of income for a sample of 45 people that included the CEOs of the five largest corporations in the United States and 40 part-time workers would be","a":"Positively skewed\nPositive skew means a longer right tail. E.g. incomes 10, 11, 12, 13, 100: a few high incomes stretch the right tail.","o":["Symmetric","Negatively skewed","Positively skewed","Uniform"]},{"q":"If a distribution of test scores has a mean of 55 and a median of 60, which shape is typically suggested?","a":"Negative skew\nA mean below the median typically suggests a long left tail, but these two statistics alone do not prove the shape.","o":["Positive skew","Symmetric","Negative skew","Uniform"]}],[{"q":"The ordered data are 5, 7, 8, 10, 12, 13, 15, 18, 20, 22, 25. There are 11 observations in total. First use the 0.25(n+1) and 0.75(n+1) position rules to locate Q1 and Q3. Then find Q1, Q3.Calculate IQR.","a":"Q1 position = 0.25(11 + 1) = 3; Q1 = 8.\nQ3 position = 0.75(11 + 1) = 9; Q3 = 20.\nIQR = Q3 - Q1 = 20 - 8 = 12.","o":[]},{"q":"The formula for mean deviation is Σ|X−x̄|/n. What is the purpose of the absolute-value signs?","a":"Prevent positive and negative deviations from cancelling out\nAbsolute values prevent cancellation. E.g. deviations −3 and +3 add to 0, but |−3| + |3| = 6.","o":["Square each deviation","Prevent positive and negative deviations from cancelling out","Make the mean deviation equal to zero","Eliminate the effect of extreme values"]},{"q":"Calculate the mean and mean deviation of 6, 8, 10, 12, and 14.","a":"Mean = (6+8+10+12+14)/5 = 10; mean deviation = (4+2+0+2+4)/5 = 2.4.","o":[]},{"q":"A factory recorded 3, 5, 4, and 8 defective items over four consecutive days. Treat these four days as the population and calculate the standard deviation.","a":"1.87\nPopulation mean = 5. Population variance = (4+0+1+9)÷4 = 3.5. σ = √3.5 ≈ 1.87.","o":["1.87","2.16","3.50","5.00"]},{"q":"A sample of six students has weekly study times of 5, 7, 7, 8, 10, and 11 hours. Find the sample variance and sample standard deviation.","a":"x̄=8; s²=(9+1+1+0+4+9)/(6−1)=4.8; s=√4.8≈2.19 hours.","o":[]},{"q":"Data sets A and B both have a mean of 15.5, with standard deviations of 3.34 and 0.93, respectively. Which data set is more concentrated?","a":"Data set B\nSame mean, different spread: B's SD 0.93 is smaller than A's 3.34, so B is more concentrated around 15.5.","o":["Data set A","Data set B"]},{"q":"Two normal distributions have the same mean: curve A is narrower and curve B is wider and flatter. Which has the larger standard deviation?","a":"Distribution B\nSame mean = same centre. Larger SD = wider, flatter curve; smaller SD = narrower, taller curve (total area stays 1).","o":["Distribution A","Distribution B"]},{"q":"Which of the following situations should NOT use a relative measure of dispersion (coefficient of variation)?","a":"Calculate the absolute differences in one class's examination scores\nSD gives absolute spread (e.g. 5 marks); CV = SD ÷ mean × 100% gives relative spread (e.g. 5/50 = 10%). Use CV to compare positive means on a ratio scale.","o":["Assess relative salary differences between two companies","Determine which of two machines has more stable processing times in relative terms","Compare the relative risk of returns on two investments","Calculate the absolute differences in one class's examination scores"]},{"q":"Company A has a mean monthly salary of 25,000 HKD and a standard deviation of 3,000 HKD; Company B has a mean monthly salary of 12,000 HKD and a standard deviation of 1,800 HKD. Calculate the CV for each company and determine which company has greater relative salary variation.\n.","a":"CV(A)=3000/25000×100%=12%; CV(B)=1800/12000×100%=15%. Company B has greater relative variation.","o":[]},{"q":"Machine A has a mean processing time of 40 seconds and a standard deviation of 2 seconds; Machine B has a mean processing time of 75 seconds and a standard deviation of 3 seconds. Which machine has more stable processing times in relative terms?","a":"Machine B\nCV = SD ÷ mean × 100: A = 5%, B = 4%. A smaller CV means less relative variation.","o":["Machine A","Machine B"]},{"q":"An investment portfolio has an average annual return of 8% and a standard deviation of 12%. Calculate its coefficient of variation. What does the result indicate?","a":"CV = (12%/8%) × 100% = 150%.\nThe standard deviation is 1.5 times the mean return, indicating very high relative variability (risk).","o":[]},{"q":"Chebyshev's theorem applies to:","a":"Any distribution with finite variance\nChebyshev: any shape with finite variance, at least 75% within 2 SDs. Empirical rule: approximately normal only, about 95% within 2 SDs.","o":["Any distribution with finite variance","Only approximately bell-shaped distributions","Only symmetric distributions","Only normal distributions"]},{"q":"A data set has a mean of 50 and a standard deviation of 6. According to Chebyshev's theorem, at least what proportion of the data lies between 38 and 62?","a":"75%\nThe endpoints are 2 SDs from the mean: k=(62−50)/6=2. Chebyshev: at least 1−1/k²=75%.","o":["50%","68%","75%","95%"]},{"q":"A distribution has a mean of 120 and a standard deviation of 15. Within what interval do at least 88.9% of the observations lie?","a":"88.9% ≈ 1 - 1/3², so k = 3. Interval: 120 ± 3(15) = [75, 165].","o":[]},{"q":"To guarantee that at least 96% of the observations lie near the mean, how many standard deviations above and below the mean are required?","a":"5\nChebyshev: 1−1/k²=0.96, so k²=25 and k=5.","o":["2","3","4","5"]},{"q":"The Empirical Rule applies to:","a":"Approximately symmetric, bell-shaped distributions\nEmpirical rule: approximately normal, 68%/95%/99.7% within 1/2/3 SDs. Chebyshev works for other shapes too, but gives lower bounds.","o":["Any distribution","Approximately symmetric, bell-shaped distributions","Only skewed distributions","Only nominal variables"]},{"q":"A bell-shaped distribution has a mean of 70 and a standard deviation of 5. Approximately what proportion of the data lies between 60 and 80?","a":"95%\n60 and 80 are 70±2×5. By the empirical rule, about 95% of bell-shaped data fall within 2 SDs.","o":["68%","75%","95%","99.7%"]},{"q":"The observations in an approximately bell-shaped distribution lie almost entirely between 25 and 85. Using the rule that the range is approximately six standard deviations, estimate the standard deviation.","a":"10\nThe specified range rule gives SD ≈ (85−25)÷6 = 10.","o":["5","10","15","60"]},{"q":"Two approximately bell-shaped data sets, A and B, have ranges of 36 and 54, respectively. Use s ≈ Range/6 to estimate their standard deviations and determine which data set is more dispersed.","a":"A: s ≈ 36/6 = 6.  B: s ≈ 54/6 = 9.\nData set B is more dispersed.","o":[]},{"q":"Find the range and interquartile range for the data set: 3 4 5 3 4 1 6 9 6","a":"Sort the data in increasing order: 1 3 3 4 4 5 6 6 9\nRange = largest number - smallest number = 9 - 1 = 8\nPosition of Q1 =0.25 × (9+1) = 2.5\nQ1 = average of 2nd and 3rd numbers = (3+3)/2 = 3\nPosition of Q3 =0.75 × (9+1) = 7.5\nQ3 = average of 7th and 8th numbers = (6+6)/2 = 6\nInterquartile range = Q3 - Q1 = 6 - 3 = 3","o":[]},{"q":"The arithmetic mean biweekly amount contributed by the ABC employees to the company's profit-sharing plan was $52, and the standard deviation is $8.5. At least what percent of the contributions lie within plus 3.5 standard deviations and minus 3.5 standard deviations of the mean?","a":"91.84%\nChebyshev gives at least 1−1/3.5²≈0.9184, or 91.84%.","o":["75%","87.76%","91.84%","95%"]},{"q":"Consider a sample with a mean 50 and a standard deviation of 6. Use Chebyshev's theorem to determine the percentage of the data within each of the following ranges.\na. 38 to 62\nb. 35 to 65\nc. 32 to 68","a":"At least 1−1/k² lies within the mean ± k standard deviations. (a) k=12/6=2: 75%; (b) k=15/6=2.5: 84%; (c) k=18/6=3: 88.89%.","o":[]},{"q":"Rainbow Trout, Inc. feeds fingerling trout in special ponds and markets them when they attain a certain weight. A group (considered the population) were isolated in a pond and fed a special food mixture called ABC. At the end of the experimental period, the average weights of the trout was 500 grams and the variance was 100 grams². Another special mixture, XYZ, was used in another pond. The mean of the population was computed to be 800 grams and the variance was 196 grams². Which food mixture results in a more uniform weight?","a":"Mixture XYZ\nCV = SD ÷ mean × 100: ABC = 2%; XYZ = 1.75%. XYZ has less relative variation.","o":["Mixture ABC","Mixture XYZ"]}],[{"q":"Which of the following is a continuous random variable?","a":"The lifetime of a light bulb measured in hours\nA continuous random variable can take any value within an interval; lifetime can include fractional hours.","o":["The number of students in a tutorial","The number of defective bulbs in a box","The lifetime of a light bulb measured in hours","The number shown when a die is rolled"]},{"q":"A light bulb has a normally distributed lifetime with μ = 19 hours and σ = 1 hour. Find: P(X = 19) =","a":"0\nNormal data are continuous: a single exact value has zero area under the curve, so P(X=19)=0.","o":["0","0.1587","0.5","1"]},{"q":"A particular normal distribution is completely determined by its:","a":"Mean and standard deviation\nμ moves the bell left or right (centre); σ makes it narrower or wider (spread). These two numbers fix a normal curve.","o":["Minimum and maximum","Mean and standard deviation","Median and range","Mode and sample size"]},{"q":"Which statement is not a property of a normal curve?","a":"Strongly right-skewed\nNormal: symmetric, equal left and right tails, mean = median = mode. Right-skewed: longer right tail, so not normal.","o":["Bell-shaped","Symmetric","Unimodal","Mean = median = mode","The total area under the curve is 1 (0.5 on each side of the mean)","Strongly right-skewed"]},{"q":"The statement that a normal curve is asymptotic means that:","a":"The tails approach the horizontal axis but never touch it\nThe tails get closer and closer to y=0 as X moves away from the mean, but the normal density remains positive for every finite X.","o":["The curve has two peaks","The curve eventually crosses the horizontal axis","The tails approach the horizontal axis but never touch it","The curve has a fixed minimum and maximum"]},{"q":"In the first pair of normal curves, the shapes are identical but their centres differ. In the second pair, the centres are identical but their widths differ. Which parameters change, respectively?","a":"μ σ\nChanging μ shifts the centre without changing shape; changing σ changes the width.","o":["μ μ","μ σ","σ μ","σ σ"]},{"q":"The 68–95–99.7 rule is appropriate for a distribution that is approximately normal.","a":"True\nFor an approximately normal distribution, about 68%, 95% and 99.7% lie within 1, 2 and 3 SDs of the mean.","o":["True","False"]},{"q":"A bulb lifetime is normally distributed with μ = 19 hours and σ = 1 hour. Use the empirical rule to find each interval.\n(a) The middle 68% of bulb lifetimes  Answer:","a":"[18, 20] hours  (μ ± σ)","o":[]},{"q":"A bulb lifetime is normally distributed with μ = 19 hours and σ = 1 hour. Use the empirical rule to find each interval.\n(b) The middle 95% of bulb lifetimes  Answer:","a":"[17, 21] hours  (μ ± 2σ)","o":[]},{"q":"A bulb lifetime is normally distributed with μ = 19 hours and σ = 1 hour. Use the empirical rule to find each interval.\n(c) The middle 99.7% of bulb lifetimes  Answer:","a":"[16, 22] hours  (μ ± 3σ)","o":[]},{"q":"Approximately what percentage of a normal distribution lies above μ + 2σ?","a":"About 2.5%\nAbout 95% lies within two SDs. The remaining 5% is split equally between the two tails: 2.5% each.","o":["About 2.5%","About 5%","About 47.5%","About 95%"]},{"q":"What are the mean and standard deviation of the standard normal distribution?","a":"μ = 0 and σ = 1\nOriginal normal scores can have any μ and positive σ. After Z=(X−μ)/σ, mean becomes 0 and SD becomes 1; Z=1 is one SD above the mean.","o":["μ = 0 and σ = 0","μ = 0 and σ = 1","μ = 1 and σ = 0","μ = 1 and σ = 1"]},{"q":"Which formula correctly calculates the Z-score of an observation \" X\" ?","a":"(X − μ)/σ\nA Z-score measures distance from the mean in SDs. E.g. mean 70, SD 10, score 90 → Z = (90 − 70)/10 = 2 (two SDs above).","o":["(X − μ)/σ","(X + μ)/σ","(μ − X)/σ","(X − μ) × σ"]},{"q":"Alice scored 85 on a Mathematics test with a mean of 70 and a standard deviation of 10. She scored 88 on an English test with a mean of 80 and a standard deviation of 5. On which test did Alice perform better relative to her classmates? Use Z-scores to explain.","a":"English\nCompare standardized scores: mathematics Z = 1.50; English Z = 1.60. The larger Z indicates better relative performance.","o":["Mathematics","English","Equal relative performance"]},{"q":"Point A is 2 standard deviations below the mean, B is at the mean, and C is 1.5 standard deviations above the mean. Find their Z-scores.","a":"Answers: (a) −2; (b) 0; (c) 1.5.","o":[]},{"q":"A distribution has μ = 50 and σ = 6. Calculate the Z-score for X = 62.\nAnswer:","a":"z = (62 − 50)/6 = 2.00.","o":[]},{"q":"A normal distribution has μ = 64 and σ = 8. A value has Z = -1.5. Find X and describe its position relative to the mean.\nAnswer:","a":"X = μ + zσ = 64 + (−1.5)(8) = 52; it is 1.5σ below the mean..","o":[]},{"q":"Which observation is farthest from its distribution mean?","a":"Z = −2.10\nIgnore the sign when comparing distance: abs(−2.10) = 2.10 SDs. The minus sign only tells you the direction (below the mean).","o":["Z = −0.40","Z = 0.75","Z = −2.10","Z = 1.35"]},{"q":"For Z = 0.85, the table gives ______________. Find P(Z < 0.85).  Answer: _______________________________________","a":"Table = 0.3023; P(Z < 0.85) = 0.5 + 0.3023 = 0.8023.","o":[]},{"q":"For Z = 0.40, the table gives ______________. Find P(Z > 0.40).  Answer: _______________________________________","a":"Table = 0.1554; P(Z > 0.40) = 0.5 − 0.1554 = 0.3446.","o":[]},{"q":"For Z = −1.35, the table gives _____________ for |Z| = 1.35. Find P(Z < −1.35).  Answer: __________________________","a":"Table = 0.4115; P(Z < −1.35) = 0.5 − 0.4115 = 0.0885.","o":[]},{"q":"For |Z| = 0.70, the table gives ______________. Find P(Z > −0.70).  Answer: _____________________________________","a":"Table = 0.2580; P(Z > −0.70) = 0.5 + 0.2580 = 0.7580.","o":[]},{"q":"For |Z| = 0.35, the table gives ______________,  for Z = 0.60 the table gives __________________\nFind P(−0.35 < Z < 0.60).  Answer:","a":"Tables: 0.1368 and 0.2257\nP = 0.1368 + 0.2257 = 0.3625.","o":[]},{"q":"For Z = 0.65 the table gives _________________, for Z = 1.05 the table gives __________________\nFind P(0.65 < Z < 1.05).  Answer:","a":"Tables: 0.2422 and 0.3531.\nP = 0.3531 − 0.2422 = 0.1109.","o":[]},{"q":"For |Z| = 0.50 the table gives _________________, for |Z| = 1.20 the table gives ________________\nFind P(−1.20 < Z < −0.50).  Answer:","a":"Tables: 0.1915 and 0.3849.\nP = 0.3849 − 0.1915 = 0.1934.","o":[]}],[{"q":"Watch lifetime: μ=1600, σ=200. P(X>1640)?","a":"0.4207\nZ=(1640−1600)/200=0.20. For the right tail, P(X>1640)=0.5−0.0793=0.4207.","o":["0.0793","0.4207","0.5793","0.0228"]},{"q":"Watch lifetime: μ=1600, σ=200, n=100. Find P(sample mean >1640).","a":"0.0228\nSE=200/√100=20; Z=(1640−1600)/20=2. Right-tail probability=0.5−0.4772=0.0228.","o":["0.4207","0.4772","0.9772","0.0228"]},{"q":"Battery lifetime: μ=5200, variance=2500. P(X<5205)?","a":"0.5398\nσ=√2500=50; Z=(5205−5200)/50=0.10. Left-tail probability=0.5+0.0398=0.5398.","o":["0.0398","0.4602","0.5398","0.8413"]},{"q":"Battery lifetime: μ=5200, variance=2500, n=100. Find P(sample mean <5205).","a":"0.8413\nSE=√2500/√100=5; Z=(5205−5200)/5=1. Left-tail probability=0.5+0.3413=0.8413.","o":["0.1587","0.3413","0.5398","0.8413"]},{"q":"Statistics calculated from random samples estimate what?","a":"Parameters\nA statistic describes a sample; a parameter describes a population. E.g. use the mean of 100 surveyed students to estimate the mean of all students.","o":["Parameters","Statistics","Samples","Sample sizes"]},{"q":"25,000 university students; 2,000 selected. Identify population and sample.","a":"25,000 population; 2,000 sample\nThe population is the entire group of interest (25,000); the sample is its selected subset (2,000).","o":["25,000 population; 2,000 sample","2,000 population; 25,000 sample"]},{"q":"Sample of 1000: average study hours 20. Identify sample size and statistic.","a":"n=1000; statistic=20\nSample size is the number of observed units; a statistic summarizes sample data, such as mean study time.","o":["n=1000; statistic=20","n=20; statistic=1000"]}],[{"q":"n=45, mean=1820, s=660. Construct a 97% confidence interval using the course large-sample Z method.","a":"1606.5 to 2033.5; z=2.17","o":[]},{"q":"The confidence interval is [1606.5, 2033.5]. Is 1700 within it?","a":"Yes\nA value is inside a confidence interval if it lies between its lower and upper limits; 1606.5 < 1700 < 2033.5.","o":["Yes","No"]},{"q":"n=20, mean=49.348, supplied s=9.012. Construct a 99% confidence interval.","a":"43.58 to 55.11; t=2.861, df=19 (using supplied s)","o":[]},{"q":"The confidence interval is [43.58, 55.11]. Is 50 within it? Is 60?","a":"50 yes; 60 no\nThe interval is about [43.58, 55.11]. 50 is inside; 60 is above the upper limit.","o":["Both yes","Both no","50 yes; 60 no","50 no; 60 yes"]},{"q":"Rainfall pH: n=40, mean=3.7, s=0.5. Construct a 99% CI using the course Z method.","a":"3.496 to 3.904","o":[]}],[{"q":"Kowloon movie duration: μ₀=84, σ=10, n=16, mean=81.5. Test whether shorter at α=.01.","a":"H₁: μ<84; z=−1; critical −2.33; fail to reject H₀.","o":[]},{"q":"Research alternative: μ > 5. Choose tail.","a":"Right-tailed\nH₁ uses >: reject only for sufficiently large statistics (right tail). < points left; ≠ uses both tails.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ < 100. Choose tail.","a":"Left-tailed\nH₁ uses <: reject only for sufficiently small statistics (left tail). > points right; ≠ uses both tails.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ ≠ 350. Choose tail.","a":"Two-tailed\nH₁ uses ≠: evidence can be in either direction; split α equally between both tails. > or < uses one tail.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ < 30. Choose tail.","a":"Left-tailed\nH₁ uses <: reject only for sufficiently small statistics (left tail). > points right; ≠ uses both tails.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ > 20. Choose tail.","a":"Right-tailed\nH₁ uses >: reject only for sufficiently large statistics (right tail). < points left; ≠ uses both tails.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ ≠ 50. Choose tail.","a":"Two-tailed\nH₁ uses ≠: evidence can be in either direction; split α equally between both tails. > or < uses one tail.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ < 84. Choose tail.","a":"Left-tailed\nH₁ uses <: reject only for sufficiently small statistics (left tail). > points right; ≠ uses both tails.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ ≠ 1600. Choose tail.","a":"Two-tailed\nH₁ uses ≠: evidence can be in either direction; split α equally between both tails. > or < uses one tail.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ ≠ 10. Choose tail.","a":"Two-tailed\nH₁ uses ≠: evidence can be in either direction; split α equally between both tails. > or < uses one tail.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"Research alternative: μ > 17.5. Choose tail.","a":"Right-tailed\nH₁ uses >: reject only for sufficiently large statistics (right tail). < points left; ≠ uses both tails.","o":["Left-tailed","Two-tailed","Right-tailed"]},{"q":"What is α for a 1% significance level?","a":"0.01\n1% ÷ 100% = 0.01. If H₀ is true, α is the allowed probability of wrongly rejecting it.","o":["0.01","0.05","0.10","0.50"]},{"q":"What is α for a 5% significance level?","a":"0.05\n5% ÷ 100% = 0.05. If H₀ is true, α is the allowed probability of wrongly rejecting it.","o":["0.01","0.05","0.10","0.50"]},{"q":"What is α for a 1% significance level?","a":"0.01\n1% ÷ 100% = 0.01. If H₀ is true, α is the allowed probability of wrongly rejecting it.","o":["0.01","0.05","0.10","0.50"]},{"q":"What is α for a 5% significance level?","a":"0.05\n5% ÷ 100% = 0.05. If H₀ is true, α is the allowed probability of wrongly rejecting it.","o":["0.01","0.05","0.10","0.50"]}],[{"q":"Wellcome checkout: n₁=50, n₂=100, means 5.5 and 5.3, SDs .4 and .3. Is standard checkout longer at α=.01?","a":"z=(5.5−5.3)/√(0.4²/50+0.3²/100)≈3.12; critical 2.33; reject H₀.","o":[]},{"q":"Engine mounting: n₁=5, n₂=6, means 4 and 5, SDs 2.9155 and 2.0976. Equal variances. Test for a difference at α=.01 (as stated in the original question).","a":"Pooled t≈−0.662, df=9; fail to reject at both 1% and 10%. Source conflicts on α.","o":[]},{"q":"Paired house appraisals: differences 7,5,12,2,7,7,4,−5,3,4. Test at α=.05.","a":"t≈3.305; df=9; critical ±2.262; reject H₀.","o":[]},{"q":"Road paint: n₁=35, n₂=40, means 36.2 and 37.0, SDs 1.14 and 1.30. Test difference at α=.01.","a":"z≈−2.84; critical ±2.58; reject H₀.","o":[]}],[{"q":"Groups: (8,6,10,9), (3,2,4,3), (3,4,5,4). State H₀ and H₁.","a":"H₀: all means equal; H₁: not all means equal\nANOVA tests whether all population means are equal. Its alternative requires at least one mean to differ, not all means to differ.","o":["H₀: all means equal; H₁: not all means equal","H₀: all means different; H₁: all means equal","H₀: all means equal; H₁: every pair differs"]},{"q":"Same groups: compute SST, SSE, SS Total.","a":"62.17, 12.75, 74.92","o":[]},{"q":"Same groups: find treatment, error and total df.","a":"2, 9, 11","o":[]},{"q":"Same groups: compute MST, MSE and F.","a":"31.0833, 1.4167, 21.94","o":[]},{"q":"At α=.05, with numerator df=2, denominator df=9 and F≈21.94, find the critical F and decision.","a":"4.26; reject H₀.","o":[]},{"q":"What does SS stand for?","o":["Sum of Squares","Sample Size","Standard Deviation","Mean Square"],"a":"Sum of Squares\nSS measures variation by adding squared deviations, e.g. (4−3)² + (2−3)² = 2."},{"q":"What does df stand for?","o":["Degrees of Freedom","Difference of Frequencies","Total Sample Size","Sum of Squares"],"a":"Degrees of Freedom\ndf counts independently varying information after constraints. In one-way ANOVA, treatment df = k−1 and error df = n−k (k groups, n observations)."},{"q":"What does MS stand for?","o":["Mean Square","Mean of Samples","Median Score","Sum of Squares"],"a":"Mean Square\nMS = SS ÷ its corresponding df. For example, SS = 20 and df = 4 give MS = 5."},{"q":"What does SST measure?","o":["Sum of Squares for Treatments (between groups)","Sum of Squares for Error (within groups)","Total Sum of Squares","Mean Square for Treatments"],"a":"Sum of Squares for Treatments (between groups)\nSST measures differences between group means and the overall mean, weighted by group sizes. In this course, SST = SS Total − SSE."},{"q":"What does SSE measure?","o":["Sum of Squares for Error (within groups)","Sum of Squares for Treatments (between groups)","Total Sum of Squares","Mean Square for Error"],"a":"Sum of Squares for Error (within groups)\nSSE measures variation within groups: subtract each observation’s own group mean, square the difference and add the squares."},{"q":"What does MST mean?","o":["Mean Square for Treatments (between groups)","Mean Square for Error (within groups)","Sum of Squares for Treatments","Total Sum of Squares"],"a":"Mean Square for Treatments (between groups)\nMST = SST ÷ (k−1), i.e. between-group SS divided by between-group df."},{"q":"What does MSE mean?","o":["Mean Square for Error (within groups)","Mean Square for Treatments (between groups)","Sum of Squares for Error","Total Sum of Squares"],"a":"Mean Square for Error (within groups)\nMSE = SSE ÷ (n−k), i.e. within-group SS divided by within-group df."},{"q":"What is SS Total?","o":["SST + SSE","SST − SSE","MST + MSE","MST ÷ MSE"],"a":"SST + SSE\nTotal variation = between-group variation + within-group variation. In this course, SS Total = SST + SSE."},{"q":"How is the F-statistic calculated?","o":["MST ÷ MSE","MSE ÷ MST","SST ÷ SSE","MST + MSE"],"a":"MST ÷ MSE\nF compares between-group to within-group mean squares. For example, MST = 10 and MSE = 2 give F = 5."}],[{"q":"In a study of students, the following four variables were measured on each student: Gender, Programme of Study, Grade point average, Level of Happiness (3: happy, 2: neutral, 1: unhappy) The level of measurement of these four variables (in order) are:","a":"Nominal, Nominal, Ratio, Ordinal\nNominal categories have no order; ordinal categories have order but no measurable gaps. The course groups GPA under interval-ratio numerical scales.","o":["Nominal, Nominal, Ratio, Ordinal","Ordinal, Nominal, Ratio, Ordinal","Nominal, Ordinal, Ratio, Nominal","Ordinal, Ordinal, Ratio, Nominal"]},{"q":"The class intervals below represent ages of students. Which set of intervals is not mutually exclusive?","a":"18-20; 22-24; 23-25\nMutually exclusive intervals cannot overlap. The intervals 22–24 and 23–25 share ages 23 and 24.","o":["18-20; 22-24; 26-27","18-20; 22-24; 23-25","18-20; 21-23; 24-27","18-19; 20-21; 22-23"]},{"q":"Which of the following must be true for a positively skewed distribution?","a":"Mean > Median\nA long right tail usually pulls the mean above the median in typical unimodal data. This is a tendency, not a universal mathematical rule.","o":["Mean < Median","Mean = Median","Mean > Median","Cannot be determined."]},{"q":"As the standard deviation of a normal distribution decreases, the percentage of the area between (mean ± 1 standard deviations) will","a":"stay the same.\nFor a normal distribution, about 68% always lies within μ ± σ. Changing σ alters width, not this proportion.","o":["increase.","stay the same.","decrease.","Cannot be determined."]},{"q":"Assuming a normal distribution of 100 cases, how many cases will be within ± 2 standard deviations of the mean?","a":"About 95\nThe empirical rule gives about 95% within two SDs: 100 × 0.95 ≈ 95.","o":["About 2","About 68","About 95","About 99"]},{"q":"The distribution of the weights of a group of fish is symmetrical and bell-shaped. Suppose the mean of the weight distribution is 50 pounds and the standard deviation of the weight distribution is 5 pounds. Using the empirical rule, you would expect 95% of the fish to have a weight between","a":"40 pounds and 60 pounds\nThe empirical rule places about 95% within μ ± 2σ: 50 ± 2(5) = 40 to 60 pounds.","o":["30 pounds and 50 pounds","30 pounds and 40 pounds","40 pounds and 60 pounds","50 pounds and 60 pounds"]},{"q":"If Peter scored in the first quartile on an exam, that means that","a":"25 percent of students who took the exam scored lower than him.\nQ1 is the 25th percentile: a score at Q1 has approximately 25% of observations below it, allowing for ties.","o":["one student who took the exam scored lower than him.","one student who took the exam scored higher than him.","25 percent of students who took the exam scored lower than him.","25 percent of students who took the exam scored higher than him."]},{"q":"If a distribution of scores has a mean of 30 and a range of 0","a":"Both variance and standard deviation are zero.\nA range of zero means all values are equal, so all deviations, variance and SD are zero.","o":["the variance is 0.","the standard deviation is 0.","Both variance and standard deviation are zero.","None of the above."]},{"q":"A study of a company's business revealed that on average it receives 40 orders in an hour. The standard deviation equals five. Assuming that the distribution is normal, what is the probability that it receives less than 35 orders in an hour?","a":"0.1587\nZ = (35 − 40) ÷ 5 = −1. The left-tail probability is 0.5 − 0.3413 = 0.1587.","o":["0.1587","0.3413","0.6587","0.8413"]},{"q":"There are about 20,000 students in the university. A professor has estimated their preferences on doing part-time job with a sample of 1,000 randomly selected students. In this example, the 20,000 students are a    \t\t and the 1,000 randomly selected students are a \t.","a":"population, sample\nA population is the full group of interest (20,000); a sample is the selected subset (1,000).","o":["parameters, statistics","statistics, parameters","population, sample","sample, population"]},{"q":"In estimation procedures, \t\t\t calculated from random \t\t are used to estimate\t\t\t.","a":"Statistics; samples; parameters\nA statistic describes a sample; a parameter describes a population. E.g. use the mean of 100 surveyed students to estimate the mean of all students.","o":["Parameters; populations; statistics","Statistics; populations; parameters","Parameters; samples; statistics","Statistics; samples; parameters"]},{"q":"The engineer has established a machine currently set to produce bags of cereals with a mean weight of 500 grams. He believes that the weight per bag varies normally with a standard deviation of 10 grams. What is the probability that a sample of 36 bags of cereals have an average weight higher than 503 grams?","a":"0.0359\nSE = 10/√36 = 1.667; Z = (503 − 500)/1.667 = 1.8. The right-tail probability is 0.0359.","o":["0.0359","0.4641","0.5359","0.9641"]},{"q":"We have constructed a 95% confidence interval for population mean. What is the chance that the interval estimate does not contain the true population mean?","a":"5%\nA 95% CI method captures the true mean in about 95 out of 100 repeated samples; about 5 intervals miss it.","o":["95%","10%","5%","Cannot be determined."]},{"q":"When we construct a confidence interval, we change the confidence level from 90% to 99%. What will happen to the width of the interval?","a":"increase.\nWith the same SE, 90% uses Z≈1.645 and 99% uses Z≈2.576. Larger multiplier → wider interval.","o":["decrease.","increase.","remain the same.","Cannot be determined."]},{"q":"Hong Kong people’s travelling time to work is normally distributed with a mean of 60 minutes and a standard deviation of 12 minutes. Find the probability that a random sample of 36 people has an average travelling time to work between 58 minutes and 62 minutes.","a":"0.6826\nSE = 12/√36 = 2. The Z limits are −1 and 1; the area between them is 0.6826.","o":["0.3413","0.4772","0.6826","0.9544"]},{"q":"Which of the following would increase the standard error of the mean?","a":"A decrease in sample size.\nSE = σ/√n. E.g. σ = 10: n = 25 gives SE = 2; n = 100 gives SE = 1. Smaller samples have larger SE.","o":["A decrease in population standard deviation","A decrease in sample mean.","A decrease in sample size.","None of the above."]},{"q":"If t distribution is used for hypothesis testing, decreasing sample size will affect","a":"Both degrees of freedom and the critical value are affected.\nReducing sample size reduces degrees of freedom and generally increases the absolute t critical value at the same α.","o":["degrees of freedom.","critical value","Both degrees of freedom and the critical value are affected.","None of the above."]},{"q":"All other things being equal, with which of the following alpha levels would we be least likely to reject the null hypothesis?","a":".001\nα=.001 allows less area in the rejection region than α=.05. A test statistic must be more extreme to reject H₀.","o":[".001",".01",".05",".10"]},{"q":"Type 1 error means that you \t the \t\thypothesis but the \t\t hypothesis is true.","a":"reject; null; null\nType I error = reject a true H₀. E.g. H₀: a new drug has no effect; concluding it works when it actually has no effect is a false positive.","o":["cannot reject; null; null","reject; null; null","cannot reject; alternative; null","reject; alternative; alternative"]},{"q":"A alpha level of 0.05 means that the decision to \t\t the null hypothesis has a \t\t in 100 chance of being incorrect.","a":"reject; 5\nα = 0.05 means a 5% probability of rejecting H₀ when H₀ is true, not a 5% probability that any rejection is wrong.","o":["reject; 0.05","reject; 5","cannot reject; 0.05","cannot reject; 5"]},{"q":"If we are doing two-sample hypothesis testing with related samples of sizes n1 = 10 and n2 = 10, what is the number of degrees of freedom?","a":"9\nA paired t-test uses one difference per pair. With 10 pairs, df = 10 − 1 = 9.","o":["9","10","19","20"]},{"q":"If we are doing two-sample hypothesis testing with independent samples of sizes n1 = 15 and n2 = 15, what is the number of degrees of freedom?","a":"28\nFor the pooled independent-samples t-test, df = n₁ + n₂ − 2 = 15 + 15 − 2 = 28.","o":["14","15","28","29"]},{"q":"400 graduates, mean salary $25000, SD $2000. Find 95% CI.","a":"24804 to 25196","o":[]},{"q":"36 drinks, mean 7.4, SD .48. Test μ=7.5 vs μ≠7.5, α=.05.","a":"z=−1.25; critical ±1.96; fail to reject H₀.","o":[]},{"q":"100 athletes: mean 68, SD 3; 100 non-athletes: mean 67, SD 4. Test greater at α=.05.","a":"z=2; critical 1.65; reject H₀.","o":[]},{"q":"ANOVA: SST=70.4, SS Total=152.93, k=3, n=15, α=.05. Complete table and decide.","a":"SSE=82.53; df=2,12,14; MST=35.2; MSE=6.88; F=5.12; critical 3.89; reject H₀.","o":[]}]];const localized={"9:0":[{"q":"一項學生研究測量了四個變量：性別、就讀專業、GPA、幸福程度（3 開心、2 中立、1 不開心）。依次屬於哪種測量尺度？","o":["名義、名義、比率、順序","順序、名義、比率、順序","名義、順序、比率、名義","順序、順序、比率、名義"],"a":"名義、名義、比率、順序\n名義尺度的類別無自然次序；順序尺度可排序但差距無法量化。本課將GPA歸入等距／比率數值尺度。"},{"q":"一项学生研究测量了四个变量：性别、就读专业、GPA、幸福程度（3 开心、2 中立、1 不开心）。依次属于哪种测量尺度？","o":["定类、定类、等比、定序","定序、定类、等比、定序","定类、定序、等比、定类","定序、定序、等比、定类"],"a":"定类、定类、等比、定序\n定类尺度的类别无自然次序；定序尺度可排序但差距无法量化。本课将GPA归入等距／等比数值尺度。"}],"9:1":[{"q":"以下組別區間代表學生年齡，哪一組不符合互斥性？","o":["18-20; 22-24; 26-27","18-20; 22-24; 23-25","18-20; 21-23; 24-27","18-19; 20-21; 22-23"],"a":"18-20; 22-24; 23-25\n互斥組距不可重疊；22至24與23至25兩組均包括23及24歲。"},{"q":"以下组区间代表学生年龄，哪一组不符合互斥性？","o":["18-20; 22-24; 26-27","18-20; 22-24; 23-25","18-20; 21-23; 24-27","18-19; 20-21; 22-23"],"a":"18-20; 22-24; 23-25\n互斥组距不可重叠；22至24与23至25两组均包括23及24岁。"}],"9:2":[{"q":"右偏分布通常具有以下哪項特徵？","o":["平均數 < 中位數","平均數 = 中位數","平均數 > 中位數","無法確定"],"a":"平均數 > 中位數\n典型單峰正偏態的右長尾通常將平均數拉至中位數以上；這是常見趨勢，並非必然定律。"},{"q":"右偏分布通常具有以下哪项特征？","o":["均值 < 中位数","均值 = 中位数","均值 > 中位数","无法确定"],"a":"均值 > 中位数\n典型单峰正偏态的右长尾通常将均值拉至中位数以上；这是常见趋势，并非必然定律。"}],"9:3":[{"q":"當常態分布的標準差減小時，平均數 ± 1 個標準差內的面積比例會怎樣？","o":["增加","保持不變","減少","無法確定"],"a":"保持不變\n常態分布中，μ ± σ內一直約有68%的觀察值；改變σ只影響寬度，不影響該比例。"},{"q":"当正态分布的标准差减小时，均值 ± 1 个标准差内的面积比例会怎样？","o":["增加","保持不变","减少","无法确定"],"a":"保持不变\n正态分布中，μ ± σ内一直约有68%的观察值；改变σ只影响宽度，不影响该比例。"}],"9:4":[{"q":"假設100個觀測值服從常態分布，約有多少個落在平均數 ± 2 個標準差內？","o":["約2","約68","約95","約99"],"a":"約95\n經驗法則指出平均數上下兩個標準差內約有95%的觀察值：100 × 0.95 ≈ 95。"},{"q":"假设100个观测值服从正态分布，约有多少个落在均值 ± 2 个标准差内？","o":["约2","约68","约95","约99"],"a":"约95\n经验法则指出均值上下两个标准差内约有95%的观察值：100 × 0.95 ≈ 95。"}],"9:5":[{"q":"魚的重量分布對稱且呈鐘形，平均數50磅，標準差5磅。根據經驗法則，約95%的魚重量在哪個區間？","o":["30至50磅","30至40磅","40至60磅","50至60磅"],"a":"40至60磅\n經驗法則指出平均數上下兩個標準差內約有95%的觀察值：50 ± 2(5) = 40至60磅。"},{"q":"鱼的重量分布对称且呈钟形，均值50磅，标准差5磅。根据经验法则，约95%的鱼重量在哪个区间？","o":["30至50磅","30至40磅","40至60磅","50至60磅"],"a":"40至60磅\n经验法则指出均值上下两个标准差内约有95%的观察值：50 ± 2(5) = 40至60磅。"}],"9:6":[{"q":"如果Peter的考試成績位於第一四分位數（Q1），意味著甚麼？","o":["一名學生成績比他低","一名學生成績比他高","25%的學生成績比他低","25%的學生成績比他高"],"a":"25%的學生成績比他低\nQ1是第25百分位數：位於Q1的分數約有25%的觀察值低於它（相同分數可能影響比例）。"},{"q":"如果Peter的考试成绩位于第一四分位数（Q1），意味着什么？","o":["一名学生成绩比他低","一名学生成绩比他高","25%的学生成绩比他低","25%的学生成绩比他高"],"a":"25%的学生成绩比他低\nQ1是第25百分位数：位于Q1的分数约有25%的观察值低于它（相同分数可能影响比例）。"}],"9:7":[{"q":"如果成績分布的平均數為30，全距為0，那麼：","o":["變異數為0","標準差為0","變異數及標準差均為0","以上皆非"],"a":"變異數及標準差均為0\n全距為零表示所有數值相等，因此離差、變異數及標準差均為零。"},{"q":"如果成绩分布的均值为30，极差为0，那么：","o":["方差为0","标准差为0","方差和标准差均为0","以上皆非"],"a":"方差和标准差均为0\n极差为零表示所有数值相等，因此离差、方差及标准差均为零。"}],"9:8":[{"q":"某公司平均每小時收到40份訂單，標準差為5。假設服從常態分布，每小時收到少於35份訂單的機率是多少？","o":["0.1587","0.3413","0.6587","0.8413"],"a":"0.1587\nZ = (35 − 40) ÷ 5 = −1；左尾機率 = 0.5 − 0.3413 = 0.1587。"},{"q":"某公司平均每小时收到40份订单，标准差为5。假设服从正态分布，每小时收到少于35份订单的概率是多少？","o":["0.1587","0.3413","0.6587","0.8413"],"a":"0.1587\nZ = (35 − 40) ÷ 5 = −1；左尾概率 = 0.5 − 0.3413 = 0.1587。"}],"9:9":[{"q":"大學有約20,000名學生，教授隨機抽取1,000名學生調查兼職偏好。20,000名學生和1,000名學生分別是甚麼？","o":["參數；統計量","統計量；參數","母體；樣本","樣本；母體"],"a":"母體；樣本\n母體是研究對象的整體（20,000人）；樣本是選取的一部分（1,000人）。"},{"q":"大学有约20,000名学生，教授随机抽取1,000名学生调查兼职偏好。20,000名学生和1,000名学生分别是什么？","o":["参数；统计量","统计量；参数","总体；样本","样本；总体"],"a":"总体；样本\n总体是研究对象的整体（20,000人）；样本是选取的一部分（1,000人）。"}],"9:10":[{"q":"在統計估計中，利用由隨機____計算所得的統計量或參數來估計未知量。下列哪組依序填入「計算所得的量；抽樣來源；估計目標」最恰當？","o":["參數；母體；統計量","統計量；母體；參數","參數；樣本；統計量","統計量；樣本；參數"],"a":"統計量；樣本；參數\n統計量描述樣本；參數描述母體。例如用 100 名受訪學生的平均數估計全校學生的平均數。"},{"q":"在统计估计中，下列哪组依次对应“计算所得的量；抽样来源；估计目标”？","o":["参数；总体；统计量","统计量；总体；参数","参数；样本；统计量","统计量；样本；参数"],"a":"统计量；样本；参数\n统计量描述样本；参数描述总体。例如用 100 名受访学生的均值估计全校学生的均值。"}],"9:11":[{"q":"機器生產的穀物袋平均重500克，重量服從常態分布，標準差10克。36袋的平均重量超過503克的機率是多少？","o":["0.0359","0.4641","0.5359","0.9641"],"a":"0.0359\n標準誤 = 10/√36 = 1.667；Z = (503 − 500)/1.667 = 1.8，右尾機率為0.0359。"},{"q":"机器生产的谷物袋平均重500克，重量服从正态分布，标准差10克。36袋的平均重量超过503克的概率是多少？","o":["0.0359","0.4641","0.5359","0.9641"],"a":"0.0359\n标准误 = 10/√36 = 1.667；Z = (503 − 500)/1.667 = 1.8，右尾概率为0.0359。"}],"9:12":[{"q":"使用95%置信區間構造方法，長期重複抽樣時，區間不包含真實母體平均數的比例是多少？","o":["95%","10%","5%","無法確定"],"a":"5%\n95% 置信區間方法在反覆抽樣 100 次時，約 95 個區間包含真實平均數，約 5 個不包含。"},{"q":"使用95%置信区间构造方法，长期重复抽样时，区间不包含真实总体均值的比例是多少？","o":["95%","10%","5%","无法确定"],"a":"5%\n95% 置信区间方法在反复抽样 100 次时，约 95 个区间包含真实均值，约 5 个不包含。"}],"9:13":[{"q":"其他條件不變，置信水平從90%提高到99%，區間寬度會怎樣？","o":["減小","增大","不變","無法確定"],"a":"增大\n標準誤相同時，90%用Z≈1.645，99%用Z≈2.576。乘數越大，區間越寬。"},{"q":"其他条件不变，置信水平从90%提高到99%，区间宽度会怎样？","o":["减小","增大","不变","无法确定"],"a":"增大\n标准误相同时，90%用Z≈1.645，99%用Z≈2.576。乘数越大，区间越宽。"}],"9:14":[{"q":"香港居民通勤時間服從常態分布，平均數60分鐘，標準差12分鐘。隨機抽取36人，其平均通勤時間介於58至62分鐘的機率是多少？","o":["0.3413","0.4772","0.6826","0.9544"],"a":"0.6826\n標準誤 = 12/√36 = 2；Z下限為−1、上限為1，兩者之間的機率為0.6826。"},{"q":"香港居民通勤时间服从正态分布，均值60分钟，标准差12分钟。随机抽取36人，其平均通勤时间介于58至62分钟的概率是多少？","o":["0.3413","0.4772","0.6826","0.9544"],"a":"0.6826\n标准误 = 12/√36 = 2；Z下限为−1、上限为1，两者之间的概率为0.6826。"}],"9:15":[{"q":"以下哪項會增加平均數的標準誤？","o":["母體標準差減小","樣本平均數減小","樣本量減小","以上皆非"],"a":"樣本量減小\n標準誤 SE = σ/√n。例如 σ = 10：n = 25 時 SE = 2；n = 100 時 SE = 1。樣本越小，標準誤越大。"},{"q":"以下哪项会增加均值的标准误？","o":["总体标准差减小","样本均值减小","样本量减小","以上皆非"],"a":"样本量减小\n标准误 SE = σ/√n。例如 σ = 10：n = 25 时 SE = 2；n = 100 时 SE = 1。样本越小，标准误越大。"}],"9:16":[{"q":"假設檢定使用t分布時，減少樣本量會影響甚麼？","o":["自由度","臨界值","自由度及臨界值均受影響","以上皆非"],"a":"自由度及臨界值均受影響\n樣本容量減少會降低自由度；在相同α下，t臨界值的絕對值通常增加。"},{"q":"假设检验使用t分布时，减少样本量会影响什么？","o":["自由度","临界值","自由度和临界值均受影响","以上皆非"],"a":"自由度和临界值均受影响\n样本量减少会降低自由度；在相同α下，t临界值的绝对值通常增加。"}],"9:17":[{"q":"其他條件相同，哪個顯著水平最不容易拒絕虛無假設？","o":[".001",".01",".05",".10"],"a":".001\nα＝.001的拒絕域比α＝.05小，檢定統計量必須更加極端才可拒絕H₀。"},{"q":"其他条件相同，哪个显著性水平最不容易拒绝原假设？","o":[".001",".01",".05",".10"],"a":".001\nα＝.001的拒绝域比α＝.05小，检验统计量必须更极端才可拒绝H₀。"}],"9:18":[{"q":"第一類錯誤表示____了____假設，但____假設為真。","o":["不拒絕；原；原","拒絕；原；原","不拒絕；備擇；原","拒絕；備擇；備擇"],"a":"拒絕；原；原\n第一類錯誤＝拒絕實際成立的虛無假設。例如新藥實際無效，卻判定它有效。"},{"q":"第一类错误表示____了____假设，但____假设为真。","o":["不拒绝；原；原","拒绝；原；原","不拒绝；备择；原","拒绝；备择；备择"],"a":"拒绝；原；原\n第一类错误＝拒绝实际成立的原假设。例如新药实际无效，却判定它有效。"}],"9:19":[{"q":"顯著水平0.05表示，當虛無假設為真時，____虛無假設的機率為每100次中的____次。","o":["拒絕；0.05","拒絕；5","不拒絕；0.05","不拒絕；5"],"a":"拒絕；5\nα = 0.05指虛無假設成立時錯誤拒絕它的機率為5%，並非任何拒絕決策出錯的機率均為5%。"},{"q":"显著性水平0.05表示，当原假设为真时，____原假设的概率为每100次中的____次。","o":["拒绝；0.05","拒绝；5","不拒绝；0.05","不拒绝；5"],"a":"拒绝；5\nα = 0.05指原假设成立时错误拒绝它的概率为5%，并非任何拒绝决策出错的概率均为5%。"}],"9:20":[{"q":"相關樣本的雙樣本假設檢定中，n1=10、n2=10，自由度是多少？","o":["9","10","19","20"],"a":"9\n配對t檢定使用每對資料的差值；10對資料的自由度 = 10 − 1 = 9。"},{"q":"相关样本的双样本假设检验中，n1=10、n2=10，自由度是多少？","o":["9","10","19","20"],"a":"9\n配对t检验使用每对数据的差值；10对数据的自由度 = 10 − 1 = 9。"}],"9:21":[{"q":"獨立樣本合併變異數 t 檢定中，n1=15、n2=15，自由度是多少？","o":["14","15","28","29"],"a":"28\n合併變異數的獨立樣本t檢定，自由度 = n₁ + n₂ − 2 = 15 + 15 − 2 = 28。"},{"q":"独立样本合并方差t检验中，n1=15、n2=15，自由度是多少？","o":["14","15","28","29"],"a":"28\n合并方差的独立样本t检验，自由度 = n₁ + n₂ − 2 = 15 + 15 − 2 = 28。"}],"9:22":[{"q":"某大學調查英語系應屆畢業生的起薪。400名畢業生回覆問卷，平均薪金為 $25,000，標準差為 $2,000。求該系所有畢業生平均起薪的95%置信區間。","o":[],"a":"24804 至 25196"},{"q":"某大学调查英语系应届毕业生的起薪。400名毕业生回复问卷，平均薪资为 $25,000，标准差为 $2,000。求该系所有毕业生平均起薪的95%置信区间。","o":[],"a":"24804 至 25196"}],"9:23":[{"q":"36份飲料，平均數7.4，標準差0.48。檢驗 μ=7.5 對 μ≠7.5，α=0.05。","o":[],"a":"z=−1.25; 臨界值 ±1.96; 未能拒絕 H₀."},{"q":"36份饮料，均值7.4，标准差0.48。检验 μ=7.5 对 μ≠7.5，α=0.05。","o":[],"a":"z=−1.25; 临界值 ±1.96; 未能拒绝 H₀."}],"9:24":[{"q":"100名參與大學體育活動程度高於平均水平的男生，平均體重68 kg，標準差3 kg；另外100名對此類活動沒有興趣的男生，平均體重67 kg，標準差4 kg。在 α=0.05 下，檢定前者的母體平均體重是否較高。","o":[],"a":"z=2; 臨界值 1.65; 拒絕 H₀."},{"q":"100名参与大学体育活动程度高于平均水平的男生，平均体重68 kg，标准差3 kg；另外100名对此类活动没有兴趣的男生，平均体重67 kg，标准差4 kg。在 α=0.05 下，检验前者的总体平均体重是否较高。","o":[],"a":"z=2; 临界值 1.65; 拒绝 H₀."}],"9:25":[{"q":"單因素變異數分析：SST=70.4，SS Total=152.93，k=3，n=15，α=0.05。完成表格並作出結論。","o":[],"a":"SSE=82.53; df=2,12,14; MST=35.2; MSE=6.88; F=5.12; 臨界值 3.89; 拒絕 H₀."},{"q":"单因素方差分析：SST=70.4，SS Total=152.93，k=3，n=15，α=0.05。完成表格并作出结论。","o":[],"a":"SSE=82.53; df=2,12,14; MST=35.2; MSE=6.88; F=5.12; 临界值 3.89; 拒绝 H₀."}],"0:0":[{"q":"甚麼是母體？","o":["為研究選取的小群體","研究者希望研究的所有人或個案","資料集中的一個變量","用於彙總資料的圖表"],"a":"研究者希望研究的所有人或個案\n母體是研究關注的全部個體。例如研究大學生的學習習慣，母體就是研究所界定的所有大學生。"},{"q":"什么是总体？","o":["为研究选取的小群体","研究者希望研究的所有人或个案","数据集中的一个变量","用于汇总数据的图表"],"a":"研究者希望研究的所有人或个案\n总体是研究关注的全部个体。例如研究大学生的学习习惯，总体就是研究所界定的所有大学生。"}],"0:1":[{"q":"甚麼是樣本？","o":["母體中選取的一部分","研究中的所有可能個案或個體","兩個變量之間的關係","母體的完整副本"],"a":"母體中選取的一部分\n樣本是母體的一部分。例如從上述母體中抽取 100 名大學生，這 100 人就是樣本。"},{"q":"什么是样本？","o":["总体中选取的一部分","研究中的所有可能个案或个体","两个变量之间的关系","总体的完整副本"],"a":"总体中选取的一部分\n样本是总体的一部分。例如从上述总体中抽取 100 名大学生，这 100 人就是样本。"}],"0:2":[{"q":"調查800名大學生，其中60%每天使用社交媒體超過6小時。","o":["描述統計","推論統計"],"a":"描述統計\n描述統計：只描述這800名受訪者；推論統計：由這800人推算全體學生。本題只描述樣本。"},{"q":"调查800名大学生，其中60%每天使用社交媒体超过6小时。","o":["描述统计","推断统计"],"a":"描述统计\n描述统计：只描述这800名受访者；推断统计：由这800人推算全体学生。本题只描述样本。"}],"0:3":[{"q":"根據800名學生的調查，估計香港所有大學生中約60%每天使用社交媒體超過6小時。","o":["描述統計","推論統計"],"a":"推論統計\n推論統計利用樣本推斷母體。例如調查 800 名學生，估計全港大學生的相關比例。"},{"q":"根据800名学生的调查，估计香港所有大学生中约60%每天使用社交媒体超过6小时。","o":["描述统计","推断统计"],"a":"推断统计\n推断统计利用样本推断总体。例如调查 800 名学生，估计全港大学生的相关比例。"}],"0:4":[{"q":"計算一個班級學生的平均年齡。","o":["單變量","雙變量","多變量"],"a":"單變量\n數變量而非人數：只有年齡是單變量；年齡加GPA是雙變量。"},{"q":"计算一个班级学生的平均年龄。","o":["单变量","双变量","多变量"],"a":"单变量\n数变量而非人数：只有年龄是单变量；年龄加GPA是双变量。"}],"0:5":[{"q":"研究學生年齡與GPA的關係。","o":["單變量","雙變量","多變量"],"a":"雙變量\n年齡加GPA共兩個變量（雙變量）；再加入性別就是三個（多變量）。"},{"q":"研究学生年龄与GPA的关系。","o":["单变量","双变量","多变量"],"a":"双变量\n年龄加GPA共两个变量（双变量）；再加入性别就是三个（多变量）。"}],"0:6":[{"q":"研究年齡與GPA的關係，並檢查男女之間是否不同。","o":["單變量","雙變量","多變量"],"a":"多變量\n年齡、GPA、性別共三個變量。一個是單變量，兩個是雙變量，三個或以上是多變量。"},{"q":"研究年龄与GPA的关系，并检查男女之间是否不同。","o":["单变量","双变量","多变量"],"a":"多变量\n年龄、GPA、性别共三个变量。一个是单变量，两个是双变量，三个或以上是多变量。"}],"0:7":[{"q":"眼睛顏色？","o":["定性","定量"],"a":"定性\n質性變量是類別（棕色、藍色）；量化變量是可量度的數值（身高、年齡）。"},{"q":"眼睛颜色？","o":["定性","定量"],"a":"定性\n定性变量是类别（棕色、蓝色）；定量变量是可测量的数值（身高、年龄）。"}],"0:8":[{"q":"年齡（以年計）？","o":["定性","定量"],"a":"定量\n年齡是數量：20歲與22歲相差2年；出生地則只是類別名稱。"},{"q":"年龄（以年计）？","o":["定性","定量"],"a":"定量\n年龄是数量：20岁与22岁相差2年；出生地则只是类别名称。"}],"0:9":[{"q":"出生國家？","o":["定性","定量"],"a":"定性\n美國、德國是類別名稱，不是數量；即使編碼為1、2也不會變成量化變量。"},{"q":"出生国家？","o":["定性","定量"],"a":"定性\n美国、德国是类别名称，不是数量；即使编码为1、2也不会变成定量变量。"}],"0:10":[{"q":"儲蓄帳戶金額？","o":["定性","定量"],"a":"定量\n存款200元比100元多100元，數字代表金額，而不是戶口類別的名稱。"},{"q":"储蓄账户金额？","o":["定性","定量"],"a":"定量\n存款200元比100元多100元，数字代表金额，而不是账户类别的名称。"}],"0:11":[{"q":"家庭子女數量？","o":["離散","連續"],"a":"離散\n離散＝計數（0、1、2名孩子，不會有1.5名）；連續＝量度（如身高1.52米）。"},{"q":"家庭子女
